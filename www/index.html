/* ASCENSÃO V3 — composição refinada da ficha de personagem. */
:root{--bg:#080f19;--panel:#111c2a;--panel2:#172333;--line:#2a3b52;--text:#f0f5ff;--muted:#9aacc4;--purple:#9a91fb;--blue:#62c8f5;--green:#6be0b9;}
body{background:radial-gradient(ellipse at 75% -15%,#1e35574d,transparent 42%),#090f19}
.sidebar{background:#0a121f;border-right-color:#243249}

.side-rank{background:linear-gradient(135deg,#1d2b41,#101c2b);border-color:#344765}
.main{max-width:none}
.v3-home{max-width:1230px;margin:auto}
.v3-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:3px 0 19px}
.v3-heading h1{font-size:clamp(26px,3.25vw,34px);letter-spacing:-.04em;margin:2px 0 2px}

.v3-photo .avatar-frame svg{width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:scale(1.04);transform-origin:center bottom}
.v3-photo .avatar-frame img{width:100%;height:100%;object-fit:cover;object-position:center 22%}

.level-pill{font-size:10px;color:#d9ceff;background:#65538d3d;border:1px solid #7968ab6a;padding:5px 10px;letter-spacing:.08em;border-radius:6px;white-space:nowrap}

.v3-class{font-size:13px;color:#a6b8d2;margin-top:5px}

.v3-biglevel>span{font-size:10px;line-height:1.65;color:#9bb4d0;font-weight:850;letter-spacing:.12em}

.v3-xp{height:7px!important;background:#28384d!important;margin-top:9px}

.v3-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.88fr);gap:17px;margin:17px 0}

.v3-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}
.v3-panel-head h2{font-size:19px;font-weight:740;letter-spacing:-.03em;margin-top:4px}
.v3-panel .eyebrow,.v3-home .eyebrow{color:#8db8e1;font-size:10px;letter-spacing:.15em}
.subtle-icon{font-size:24px;color:#88a9cc}

.v3-footnote{font-size:11px;color:#8194ac;margin-top:16px;line-height:1.6}
.radar-panel{text-align:left;min-height:328px}
.radar{display:block;max-width:100%;width:100%;height:242px;margin:-6px auto 0}

.attrib-icon{font-size:21px;color:#88c6e5}

.attrib-controls{display:flex;align-items:center;gap:4px}.attrib-controls b{min-width:22px;text-align:center;color:#e1f4ff}
.stat-adjust{width:25px;height:26px;border:1px solid #42556b;background:#1c3145;color:#bcd6ea;border-radius:7px;font-size:18px;display:grid;place-items:center;line-height:1;padding:0}

.v3-reserve{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:18px;background:linear-gradient(115deg,#183a43,#15253b 63%,#1a2940);border:1px solid #367b80;border-radius:18px;padding:24px;align-items:start}
.reserve-icon{height:56px;width:56px;border:1px solid #4e9ca1;background:#214951;color:#8be9dd;border-radius:13px;font-size:27px;display:grid;place-items:center}
.reserve-body .upper{color:#70d8c9}.reserve-body h2{font-size:23px;margin:5px 0}.reserve-body p{font-size:12px;color:#b6ccd2}.reserve-amount{margin:19px 0 9px;color:#e2fff9;font-size:clamp(23px,3vw,32px);font-weight:850;letter-spacing:-.035em}.reserve-amount span{font-size:13px;color:#95bdbb;font-weight:500;letter-spacing:0}
.reserve-body .progress{height:9px;background:#18414a}.reserve-actions{display:grid;gap:8px;min-width:144px}
.reserve-actions .btn{white-space:normal}.small-numbers{color:#93b6b9;font-size:11px;margin-top:8px;gap:9px;flex-wrap:wrap}
.v3-finance-stats,.v3-history-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:17px 0 22px}
.v3-fin-stat,.v3-history-stats>div{padding:16px 18px;background:#121f2f;border:1px solid #2a4157;border-radius:12px;display:flex;flex-direction:column;gap:7px;min-width:0}

.v3-fin-stat strong,.v3-history-stats b{font-size:21px;color:#effaff;overflow-wrap:anywhere}
.v3-finance-heading{margin:26px 0 13px}.v3-finance-heading h2{font-size:19px}.v3-finance-heading p{color:#90a6c0;margin-top:5px;font-size:12px}
.v3-finance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.v3-finance-item{background:#121e2c;border:1px solid #2b3d55;border-radius:15px;overflow:hidden;min-width:0}
.finance-cover{height:145px;background:radial-gradient(ellipse at center,#2a435c,#131e2a 72%);display:grid;place-items:center;border-bottom:1px solid #2c4156}
.finance-cover span{font-size:50px;color:#557998}.finance-cover img{width:100%;height:100%;object-fit:cover;object-position:center}
.finance-item-content{padding:18px}.finance-item-content h3{font-size:18px;margin-top:4px}.finance-numbers{display:flex;align-items:baseline;gap:8px;margin:17px 0 9px;flex-wrap:wrap}.finance-numbers strong{font-size:20px;color:#d9fff3}.finance-numbers span{color:#90a9bb;font-size:12px}
.finance-monthly{padding:12px;background:#172a3a;border:1px solid #2f4c62;border-radius:10px;margin-top:16px;display:flex;flex-direction:column;gap:4px}
.finance-monthly>span{font-size:10px;letter-spacing:.08em;color:#94bad2;font-weight:750}.finance-monthly b{font-size:17px;color:#b4f4e4}.finance-monthly small{font-size:11px;color:#86a4b8}
.v3-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:60px 20px;background:#132132;border:1px dashed #37506a;border-radius:14px}.v3-empty>div{font-size:48px;color:#81bce5}.v3-empty p{color:#93a9bd;max-width:430px}

.timeline-dot{width:8px;height:8px;background:#7696b1;border-radius:50%}.timeline-dot.mission,.timeline-dot.goal{background:#a39aff}.timeline-dot.habit,.timeline-dot.nofap{background:#f1bb8a}.timeline-dot.financial{background:#6fd6b8}.timeline-dot.workout{background:#81c5ff}.timeline-dot.attribute{background:#ce99ff}

function dayDiff(a,b){return Math.round((toDate(b)-toDate(a))/86400000)}
function dateHuman(s){if(!s)return 'Sem data';return toDate(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'id_'+(crypto.randomUUID?.()||`${Date.now()}_${Math.random().toString(36).slice(2)}`)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}

function normalize(data){const d=INITIAL(),raw=data&&typeof data==='object'?data:{},x={...raw};delete x.pomo;
 const priorities=Array.isArray(x.settings?.priorities)&&x.settings.priorities.length?x.settings.priorities:structuredClone(DEFAULT_PRIORITIES);
 const used=new Set();const valid=priorities.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(Number(p.xp))&&p.name.trim()).map(p=>({id:p.id.slice(0,80),name:p.name.slice(0,35),xp:clamp(Math.round(Number(p.xp)),0,1000)})).filter(p=>!used.has(p.id)&&used.add(p.id));
 const profile={...d.profile,...x.profile};profile.levelImages=Object.fromEntries(Object.entries(profile.levelImages||{}).filter(([k,v])=>(k==='1'||(Number(k)>=5&&Number(k)%5===0&&Number(k)<=200))&&typeof v==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(v)));
 if(!/^data:image\/(jpeg|png|webp|gif);base64,/.test(profile.image||''))profile.image=null;
 const shop={...d.shop,...x.shop,items:Array.isArray(x.shop?.items)?x.shop.items:d.shop.items,purchases:Array.isArray(x.shop?.purchases)?x.shop.purchases:[]};
 return {...d,...x,version:2,profile,settings:{...d.settings,...x.settings,priorities:valid.length?valid:structuredClone(DEFAULT_PRIORITIES)},shop,tasks:Array.isArray(x.tasks)?x.tasks:[],habits:Array.isArray(x.habits)?x.habits:[],goals:Array.isArray(x.goals)?x.goals:[],workouts:Array.isArray(x.workouts)?x.workouts:[],weights:Array.isArray(x.weights)?x.weights:[],ledger:Array.isArray(x.ledger)?x.ledger:[],nofap:{...d.nofap,...x.nofap}};
}

function toast(message,type=''){let root=$('#toast-root');let el=document.createElement('div');el.className='toast '+type;el.textContent=message;root.append(el);setTimeout(()=>el.remove(),4300)}
function setLedger(key,delta,label){st.ledger=st.ledger.filter(e=>e.key!==key);if(delta)st.ledger.push({key,delta,label,at:new Date().toISOString()})}
function xp(){return st.ledger.reduce((a,e)=>a+(Number(e.delta)||0),0)}
function levelInfo(){let total=Math.max(0,xp()),n=1,left=total,need=140;while(left>=need&&n<200){left-=need;n++;need=Math.round(140*Math.pow(n,1.26))}return {level:n,current:left,need,percent:clamp(100*left/need,0,100),total:xp()}}
function tier(l){return l>=15?4:l>=10?3:l>=5?2:1}
function rank(l){return l>=20?'S':l>=14?'A':l>=9?'B':l>=5?'C':l>=3?'D':'E'}
function tierName(t){return ['','Despertar','Manipulador de sombras','Ascendente','Soberano da própria jornada'][t]}
function scoreSummary(){const all=st.tasks.filter(t=>t.period==='day');const done=all.filter(t=>taskStatus(t)==='done').length;return {all:all.length,done,percent:all.length?Math.round(100*done/all.length):0}}
function taskStatus(t){return t.repeat==='daily'?(t.events?.[TODAY()]||'todo'):(t.status||'todo')}
function taskLedgerKey(t,d=TODAY()){return `task:${t.id}:${t.repeat==='daily'?d:'once'}`}
function priorityInfo(id){return st.settings.priorities.find(p=>p.id===id)||st.settings.priorities[0]}
function taskReward(t){return priorityInfo(t.priority)?.xp??0}
function taskPenalty(t){return -Math.max(45,Math.ceil(taskReward(t)*1.5))}
function milestone(level){return level<5?1:Math.floor(level/5)*5}
function nextMilestone(level){return level<5?5:Math.floor(level/5)*5+5}
function characterImage(){const lv=levelInfo().level,images=st.profile.levelImages||{};for(let n=milestone(lv);n>=5;n-=5){if(images[n])return images[n]}return images[1]||st.profile.image||''}
function coinsEarned(){return st.ledger.reduce((a,e)=>a+Math.floor(Math.max(0,Number(e.delta)||0)/5),0)}
function coinsSpent(){return (st.shop.purchases||[]).reduce((a,p)=>a+(Number(p.cost)||0),0)}
function coinBalance(){return Math.max(0,coinsEarned()-coinsSpent())}
function markTask(id,status){let t=st.tasks.find(t=>t.id===id);if(!t)return;let prev=taskStatus(t),next=prev===status?'todo':status;if(t.repeat==='daily'){t.events ||= {};if(next==='todo')delete t.events[TODAY()];else t.events[TODAY()]=next}else t.status=next;setLedger(taskLedgerKey(t),next==='done'?taskReward(t):next==='missed'?taskPenalty(t):0,`${t.title} • ${next}`);save();render();toast(next==='done'?`Missão concluída: +${taskReward(t)} XP`:next==='missed'?`Missão perdida: ${taskPenalty(t)} XP`: 'Marcação desfeita',next==='done'?'positive':next==='missed'?'negative':'')}
function applyAutoMisses(){if(!st.settings.autoPenalty)return;let today=TODAY(),last=st.lastVisit||today;if(last>today)last=today;let min=addDays(today,-3);if(last<min)last=min;for(let d=last;d<today;d=addDays(d,1)){for(const t of st.tasks){if(t.repeat==='daily'&&t.period==='day'&&(t.createdAt||today)<=d){t.events||={};if(!t.events[d]){t.events[d]='missed';setLedger(taskLedgerKey(t,d),taskPenalty(t),`Missão diária não concluída: ${t.title}`)}}}}for(const t of st.tasks){if(t.repeat!=='daily'&&t.status!=='done'&&t.status!=='missed'&&t.dueDate&&t.dueDate<today){t.status='missed';setLedger(taskLedgerKey(t),taskPenalty(t),`Missão vencida: ${t.title}`)}}st.lastVisit=today;save()}

function markHabit(id,type){const h=st.habits.find(h=>h.id===id);if(!h)return;h.events||={};const k=`habit:${id}:${TODAY()}`;const next=h.events[TODAY()]===type?null:type;if(next)h.events[TODAY()]=next;else delete h.events[TODAY()];setLedger(k,next==='resist'?12:next==='slip'?-35:0,`${h.name} • ${next||'sem registro'}`);save();render();toast(next==='resist'?'+12 XP • Escolha consciente registrada':next==='slip'?'−35 XP • Reveja seu plano e siga adiante':'Registro removido',next==='resist'?'positive':next==='slip'?'negative':'')}

<div class="grid-2" style="margin-top:18px"><section class="card"><h2 style="margin-bottom:12px">◈ Plano para o momento de vontade</h2><div class="content-stack" style="gap:12px"><div class="notice positive"><strong>1. Reconheça a vontade.</strong> Observe-a como uma onda, sem precisar agir imediatamente. Respire e note as sensações por alguns minutos.</div><div class="notice"><strong>2. Mude o contexto.</strong> Afaste o gatilho, saia da tela, caminhe, converse ou faça outra atividade significativa.</div><div class="notice"><strong>3. Prepare uma resposta “se–então”.</strong> Ex.: “Se eu ficar sozinho e ansioso à noite, então vou guardar o celular e ler por dez minutos”.</div><div class="field"><label>Meu plano de ação pessoal</label><textarea id="nofap-plan" placeholder="Quando eu sentir vontade, vou...">${esc(st.nofap.plan||'')}</textarea><button class="btn ghost" data-action="nofap-save-plan">Salvar meu plano</button></div></div></section><section class="card"><h2 style="margin-bottom:12px">Ciência, sem mitos</h2><p class="muted" style="margin-bottom:12px">Os 90 dias são uma meta pessoal, não um prazo cientificamente demonstrado para “reiniciar o cérebro”. Aprender hábitos pode levar tempos muito diferentes de pessoa para pessoa.</p><p class="muted" style="margin-bottom:12px">Masturbação, por si só, é um comportamento sexual normal. O que merece atenção clínica é a perda persistente de controle com prejuízo importante na vida. Ter culpa exclusivamente moral não equivale a um transtorno.</p><p class="muted" style="margin-bottom:14px">Se esse comportamento causar sofrimento intenso ou afetar seu cotidiano, buscar um psicólogo ou profissional de saúde pode ajudar. Um deslize é informação para ajustar estratégias, não prova de fracasso.</p><div class="link-list"><a href="https://www.who.int/publications/i/item/9789240077263/" target="_blank" rel="noopener">OMS · CID-11</a><a href="https://my.clevelandclinic.org/health/articles/24332-masturbation" target="_blank" rel="noopener">Cleveland Clinic</a><a href="https://www.mirecc.va.gov/MIRECC/visn5/EBT/CBT-SUD/Urge-Surfing.asp" target="_blank" rel="noopener">VA · Urge surfing</a><a href="https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674" target="_blank" rel="noopener">Estudo de hábitos</a></div></section></div>`}
function habits(){return `${pageHeading('BATALHA CONTRA OS GATILHOS','Hábitos a evitar','Identifique o que atrapalha sua jornada e planeje respostas reais.',`<button class="btn primary" data-action="habit-add">＋ Novo hábito</button>`)}<div class="notice positive" style="margin-bottom:18px">Estratégia: registre o gatilho e formule uma alternativa concreta. Resistir hoje rende +12 XP; registrar um deslize custa −35 XP, sem apagar seus outros progressos.</div>${st.habits.length?`<div class="card-grid">${st.habits.map(h=>{const ev=h.events?.[TODAY()];return `<section class="habit-card"><div class="feature-row"><h3>⚑ ${esc(h.name)}</h3><div class="inline-actions"><button class="btn ghost tiny-btn" data-action="habit-edit" data-id="${h.id}">Editar</button><button class="btn ghost tiny-btn" data-action="habit-delete" data-id="${h.id}" aria-label="Excluir hábito">×</button></div></div><p class="muted" style="margin-top:6px">${esc(h.description||'O que esse hábito está afetando?')}</p><div class="plan"><div class="upper">GATILHO</div><div>${esc(h.trigger||'Ainda não identificado')}</div><div class="mini-divider" style="margin:10px 0"></div><div class="upper">COMO VOU RESOLVER</div><div>${esc(h.solution||'Defina uma alternativa na edição do hábito.')}</div></div><div class="inline-actions" style="flex-wrap:wrap"><button class="btn ${ev==='resist'?'success':'ghost'} tiny-btn" data-action="habit-resist" data-id="${h.id}">${ev==='resist'?'✓ Resistiu hoje':'+12 XP · Resisti'}</button><button class="btn ${ev==='slip'?'danger':'ghost'} tiny-btn" data-action="habit-slip" data-id="${h.id}">${ev==='slip'?'× Registrado':'−35 XP · Deslize'}</button></div></section>`}).join('')}</div>`:`<div class="empty"><span class="glyph">⚑</span>Você ainda não cadastrou hábitos a evitar.<div style="margin-top:12px"><button class="btn primary" data-action="habit-add">Criar primeiro hábito</button></div></div>`}`}
function goals(){return `${pageHeading('MAPA DE CONQUISTAS','Metas','Conecte uma meta a um hábito e acompanhe quanto falta para chegar lá.',`<button class="btn primary" data-action="goal-add">＋ Nova meta</button>`)}${st.goals.length?`<div class="card-grid">${st.goals.map(g=>{const percent=clamp(100*g.current/Math.max(1,g.target),0,100),habit=st.habits.find(h=>h.id===g.habitId);return `<section class="goal-card"><div class="feature-row"><div><div class="upper">META ${percent===100?'CONCLUÍDA':'ATIVA'}</div><h3 style="margin-top:5px">${esc(g.name)}</h3></div><button class="btn ghost tiny-btn" data-action="goal-edit" data-id="${g.id}">Editar</button></div><p class="muted" style="margin-top:7px">${esc(g.description||'Progresso rumo à próxima conquista.')}</p><div class="goal-meta">${habit?`<span class="tag purple">⚑ ${esc(habit.name)}</span>`:''}${g.deadline?`<span class="tag">▣ ${dateHuman(g.deadline)}</span>`:''}${percent===100?`<span class="tag green">★ +70 XP</span>`:''}</div><div class="spread"><div class="big">${Number(g.current).toLocaleString('pt-BR')} <small class="muted">/ ${Number(g.target).toLocaleString('pt-BR')} ${esc(g.unit||'')}</small></div><b>${Math.round(percent)}%</b></div><div class="progress" style="margin:10px 0 14px"><span style="width:${percent}%"></span></div><div class="inline-actions"><button class="btn ghost tiny-btn" data-action="goal-step" data-id="${g.id}" data-dir="-1">− 1</button><button class="btn primary tiny-btn" data-action="goal-step" data-id="${g.id}" data-dir="1">＋ 1 progresso</button><button class="btn ghost tiny-btn" data-action="goal-delete" data-id="${g.id}">Excluir</button></div></section>`}).join('')}</div>`:`<div class="empty"><span class="glyph">◎</span>Comece por uma meta simples e mensurável.<div style="margin-top:12px"><button class="btn primary" data-action="goal-add">Criar minha primeira meta</button></div></div>`}`}
function weightGraph(){let points=st.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);if(points.length<2)return `<div class="empty">Registre pelo menos duas pesagens para visualizar sua tendência.</div>`;let vals=points.map(x=>Number(x.weight));let min=Math.floor(Math.min(...vals)-1),max=Math.ceil(Math.max(...vals)+1),width=620,height=180,padX=37,padY=23;let coords=points.map((p,i)=>[padX+(width-2*padX)*i/(points.length-1),height-padY-(Number(p.weight)-min)/(max-min)*(height-2*padY)]);let poly=coords.map(p=>p.join(',')).join(' ');let last=coords[coords.length-1];return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto" role="img" aria-label="Gráfico de evolução do peso em quilogramas"><line x1="${padX}" y1="${padY}" x2="${padX}" y2="${height-padY}" stroke="#53607c"/><line x1="${padX}" y1="${height-padY}" x2="${width-padX}" y2="${height-padY}" stroke="#53607c"/><text x="4" y="${padY+5}" fill="#91a0be" font-size="12">${max} kg</text><text x="4" y="${height-padY}" fill="#91a0be" font-size="12">${min} kg</text><polyline points="${poly}" fill="none" stroke="#9b82ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#50d5ff"/>`).join('')}<text x="${Math.max(30,last[0]-37)}" y="${Math.max(12,last[1]-12)}" font-size="12" font-weight="bold" fill="#e2dcff">${vals[vals.length-1]} kg</text></svg><div class="spread tiny"><span>${dateHuman(points[0].date)}</span><span>${dateHuman(points[points.length-1].date)}</span></div>`}
function gym(){let w=st.weightTarget||{},weights=st.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)),current=weights.length?Number(weights[weights.length-1].weight):(w.start===null?null:Number(w.start));let start=w.start===null?null:Number(w.start),target=w.target===null?null:Number(w.target),hasGoal=start!==null&&target!==null;let pct=hasGoal?(start===target?100:clamp((current-start)/(target-start)*100,0,100)):0;return `${pageHeading('PORTÃO DE TREINAMENTO','Academia','Planejamento de exercícios, alimentação e progresso físico.')}
<div class="card" style="margin-bottom:19px"><div class="section-title"><div><h2>◇ Meta de peso</h2><p>Acompanhe tendências ao longo do tempo, sem buscar variações extremas.</p></div><button class="btn ghost" data-action="weight-goal">Definir meta</button></div><div class="weight-summary"><div><div class="upper">INICIAL</div><strong>${start===null?'—':start.toLocaleString('pt-BR')}</strong><small>kg</small></div><div><div class="upper">ATUAL</div><strong>${current===null?'—':current.toLocaleString('pt-BR')}</strong><small>kg</small></div><div><div class="upper">META</div><strong>${target===null?'—':target.toLocaleString('pt-BR')}</strong><small>kg</small></div></div><div class="spread" style="margin:18px 0 8px"><b>Progresso até a meta</b><b>${Math.round(pct)}%</b></div><div class="progress green"><span style="width:${pct}%"></span></div><div class="inline-actions" style="margin-top:17px;flex-wrap:wrap"><button class="btn primary" data-action="weight-log">＋ Registrar pesagem</button><small class="muted">Histórico disponível no seu dispositivo.</small></div><div class="mini-divider"></div>${weightGraph()}</div>

function shop(){const purchases=(st.shop.purchases||[]).slice().reverse();return `${pageHeading('MERCADO DO CAÇADOR','Loja de recompensas','Troque cristais por recompensas pessoais que você mesmo configura.',`<button class="btn primary" data-action="shop-add">＋ Criar recompensa</button>`)}<section class="card shop-wallet"><div><div class="upper">SEU SALDO</div><div class="shop-coins">✦ ${coinBalance()} <span>cristais</span></div><p class="muted">Você ganha 1 cristal a cada 5 XP positivos recebidos. Compras não descontam níveis ou XP.</p></div><span class="shop-mark">✧</span></section><div class="shop-grid">${st.shop.items.length?st.shop.items.map(item=>`<section class="card shop-item"><div class="shop-item__sigil">✦</div><div class="upper">RECOMPENSA PERSONALIZADA</div><h3>${esc(item.name)}</h3><p>${esc(item.detail||'Sua recompensa pessoal')}</p><div class="spread shop-item__foot"><strong>✦ ${Number(item.cost)||0}</strong><button class="btn primary tiny-btn" data-action="shop-buy" data-id="${esc(item.id)}" ${coinBalance()<item.cost?'disabled':''}>Resgatar</button></div><button class="btn ghost tiny-btn" data-action="shop-edit" data-id="${esc(item.id)}">Editar</button><button class="btn ghost tiny-btn" data-action="shop-delete" data-id="${esc(item.id)}">Excluir</button></section>`).join(''):`<section class="card empty">Crie sua primeira recompensa para começar.</section>`}</div><section class="card" style="margin-top:18px"><h2>Histórico de resgates</h2>${purchases.length?purchases.slice(0,15).map(x=>`<div class="stat-row"><span>${esc(x.name)}<div class="tiny">${esc(new Date(x.at).toLocaleDateString('pt-BR'))}</div></span><span class="tag gold">−${Number(x.cost)||0} cristais</span></div>`).join(''):'<div class="empty">Nenhuma recompensa resgatada ainda.</div>'}</section><div class="notice" style="margin-top:16px">Loja inicial de recompensas pessoais. Como a frase sobre a loja ficou incompleta, os tipos de itens e a economia podem ser modificados na próxima versão.</di function modalShopItem(id){let item=st.shop.items.find(x=>x.id===id)||{id:'',name:'',detail:'',cost:25};showModal(id?'Editar recompensa':'Criar recompensa',`<input type="hidden" name="id" value="${esc(item.id)}"><div class="form-grid"><div class="field full"><label>Nome da recompensa</label><input name="name" maxlength="80" required placeholder="Ex.: Um episódio de anime" value="${esc(item.name)}"></div><div class="field"><label>Custo em cristais</label><input name="cost" type="number" min="1" max="100000" required value="${item.cost}"></div><div class="field full"><label>Descrição</label><textarea name="detail" maxlength="300" placeholder="O que você se permite ao resgatar?">${esc(item.detail)}</textarea></div></div>`,'shop-item-form')}

case 'task-add':modalTask('',period);break;case 'task-edit':modalTask(id);break;
case 'task-delete':if(confirm('Excluir este bloco e seu histórico de XP?')){st.tasks=st.tasks.filter(t=>t.id!==id);st.ledger=st.ledger.filter(e=>!e.key.startsWith(`task:${id}:`));save();closeModal();render()}break;
case 'task-done':markTask(id,'done');break;case 'task-miss':markTask(id,'missed');break;
case 'shop-add':modalShopItem();break;
case 'shop-edit':modalShopItem(id);break;
case 'shop-delete':if(confirm('Excluir esta recompensa da loja? As compras anteriores permanecerão no histórico.')){st.shop.items=st.shop.items.filter(x=>x.id!==id);save();render()}break;
case 'shop-buy':{const item=st.shop.items.find(x=>x.id===id);if(!item)return;const cost=Number(item.cost);if(!Number.isFinite(cost)||cost<=0||coinBalance()<cost){toast('Cristais insuficientes','negative');return}if(!confirm(`Resgatar “${item.name}” por ${cost} cristais?`))return;st.shop.purchases.push({id:uid(),itemId:item.id,name:item.name,cost,at:new Date().toISOString()});save();render();toast('Recompensa resgatada!','positive');break}
case 'priority-delete':{if(st.settings.priorities.length<=1){toast('Mantenha ao menos uma prioridade','negative');return}if(st.tasks.some(t=>t.priority===id)){toast('Antes de excluir, altere a prioridade das missões vinculadas','negative');return}st.settings.priorities=st.settings.priorities.filter(p=>p.id!==id);save();render();toast('Prioridade excluída');break}
case 'level-image-clear':{const n=Number(el.dataset.level);delete st.profile.levelImages[n];save();render();toast('Imagem removida');break}

case 'nofap-slip':if(confirm('Registrar um deslize hoje? Isso substituirá eventual marcação de dia concluído e descontará 55 XP.'))markNoFap(TODAY(),'slip');break;
case 'nofap-restart':if(confirm('Começar um novo ciclo de 90 dias hoje? O ciclo atual será guardado no histórico e o saldo de XP continuará.')){st.nofap.history||=[];st.nofap.history.push({start:st.nofap.start,end:TODAY(),events:st.nofap.events});st.nofap.start=TODAY();st.nofap.events={};save();render();toast('Novo ciclo iniciado. O aprendizado permanece.')}break;
case 'nofap-save-plan':st.nofap.plan=$('#nofap-plan')?.value||'';save();toast('Plano pessoal salvo','positive');break;
case 'habit-add':modalHabit();break;case 'habit-edit':modalHabit(id);break;
case 'habit-delete':if(confirm('Excluir este hábito e seus registros?')){st.habits=st.habits.filter(h=>h.id!==id);st.ledger=st.ledger.filter(e=>!e.key.startsWith(`habit:${id}:`));st.goals.forEach(g=>{if(g.habitId===id)g.habitId=''});save();render()}break;
case 'habit-resist':markHabit(id,'resist');break;case 'habit-slip':markHabit(id,'slip');break;
case 'goal-add':modalGoal();break;case 'goal-edit':modalGoal(id);break;
case 'goal-step':{const g=st.goals.find(g=>g.id===id);if(!g)return;g.current=clamp(g.current+Number(el.dataset.dir),0,g.target);saveGoalReward(g);save();render();if(g.current===g.target)toast('Meta alcançada! +70 XP','positive');break}
case 'goal-delete':if(confirm('Excluir esta meta?')){st.goals=st.goals.filter(g=>g.id!==id);st.ledger=st.ledger.filter(e=>e.key!==`goal:${id}`);st.tasks.forEach(t=>{if(t.goalId===id)t.goalId=''});save();render()}break;
case 'workout-add':modalWorkout();break;case 'workout-edit':modalWorkout(id);break;
case 'workout-delete':if(confirm('Excluir exercício e seus registros?')){st.workouts=st.workouts.filter(x=>x.id!==id);st.ledger=st.ledger.filter(e=>!e.key.startsWith(`workout:${id}:`));save();render()}break;
case 'workout-done':case 'workout-miss':{const w=st.workouts.find(x=>x.id===id);if(!w)return;const kind=name==='workout-done'?'done':'missed';w.events||={};let next=w.events[TODAY()]===kind?null:kind;if(next)w.events[TODAY()]=next;else delete w.events[TODAY()];setLedger(`workout:${id}:${TODAY()}`,next==='done'?10:next==='missed'?-25:0,`Treino ${w.name}: ${next}`);save();render();toast(next==='done'?'+10 XP · Exercício realizado':next==='missed'?'−25 XP · Exercício não realizado':'Registro desfeito',next==='done'?'positive':next==='missed'?'negative':'');break}
case 'weight-goal':modalWeightGoal();break;case 'weight-log':modalWeightLog();break;
case 'export':{const blob=new Blob([JSON.stringify({app:'ascensao',version:2,exportedAt:new Date().toISOString(),data:st},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ascensao-backup-${TODAY()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup exportado','positive');break}
case 'import':$('#import-file').click();break;
case 'reset-all':if(confirm('Isso apagará TODOS os dados deste navegador. Recomendamos exportar um backup antes. Continuar?')&&confirm('Confirmar exclusão permanente dos dados locais?')){st=INITIAL();save();render();toast('Dados locais redefinidos')}break;

}}
function submitForm(id,form){const d=Object.fromEntries(new FormData(form));if(form.dataset.form==='priority-update'){const p=st.settings.priorities.find(x=>x.id===form.dataset.id),reward=Number(d.xp);if(!p||!d.name?.trim()||!Number.isInteger(reward)||reward<0||reward>1000){toast('Confira nome e XP','negative');return}p.name=d.name.trim();p.xp=reward;save();render();toast('Prioridade atualizada','positive');return}switch(id){
case 'task-form':{let old=st.tasks.find(t=>t.id===d.id),task={...(old||{}),id:old?.id||uid(),title:d.title.trim(),period:d.period,priority:st.settings.priorities.some(p=>p.id===d.priority)?d.priority:st.settings.priorities[0].id,dayPart:['morning','afternoon','night'].includes(d.dayPart)?d.dayPart:'',time:d.time,dueDate:d.dueDate,repeat:d.repeat,goalId:d.goalId,notes:d.notes.trim(),createdAt:old?.createdAt||TODAY(),events:old?.events||{},status:old?.status||'todo',order:old?.order??st.tasks.filter(t=>t.period===d.period).length};if(old){if(old.repeat!==task.repeat){st.ledger=st.ledger.filter(e=>!e.key.startsWith(`task:${old.id}:`));task.status='todo';task.events={}}Object.assign(old,task)}else st.tasks.push(task);save();closeModal();render();toast('Missão salva','positive');break}
case 'habit-form':{const old=st.habits.find(h=>h.id===d.id),h={...(old||{}),id:old?.id||uid(),name:d.name.trim(),description:d.description.trim(),trigger:d.trigger.trim(),solution:d.solution.trim(),events:old?.events||{}};if(old)Object.assign(old,h);else st.habits.push(h);save();closeModal();render();toast('Hábito salvo','positive');break}
case 'goal-form':{const target=Math.round(Number(d.target)),current=clamp(Math.round(Number(d.current)),0,target);const old=st.goals.find(g=>g.id===d.id),g={...(old||{}),id:old?.id||uid(),name:d.name.trim(),description:d.description.trim(),target,current,unit:d.unit.trim(),deadline:d.deadline,habitId:d.habitId};if(old)Object.assign(old,g);else st.goals.push(g);saveGoalReward(g);save();closeModal();render();toast('Meta salva','positive');break}
case 'workout-form':{const old=st.workouts.find(x=>x.id===d.id),w={...(old||{}),id:old?.id||uid(),name:d.name.trim(),day:d.day,sets:d.sets,reps:d.reps,load:d.load.trim(),events:old?.events||{}};if(old)Object.assign(old,w);else st.workouts.push(w);save();closeModal();render();toast('Exercício salvo','positive');break}
case 'weight-goal-form':st.weightTarget={start:Number(d.start),target:Number(d.target)};save();closeModal();render();toast('Meta de peso salva','positive');break;
case 'weight-log-form':{const e=st.weights.find(w=>w.date===d.date);if(e)e.weight=Number(d.weight);else st.weights.push({date:d.date,weight:Number(d.weight)});save();closeModal();render();toast('Pesagem registrada','positive');break}
case 'priority-create-form':{if(st.settings.priorities.length>=30){toast('Limite de 30 prioridades','negative');return}const name=d.name?.trim(),reward=Number(d.xp);if(!name||!Number.isInteger(reward)||reward<0||reward>1000){toast('Nome ou XP inválido','negative');return}st.settings.priorities.push({id:uid(),name,xp:reward});save();render();toast('Prioridade adicionada','positive');break}
case 'shop-item-form':{const name=d.name?.trim(),cost=Number(d.cost);if(!name||!Number.isInteger(cost)||cost<1||cost>100000){toast('Confira nome e custo','negative');return}const old=st.shop.items.find(x=>x.id===d.id),item={id:old?.id||uid(),name,detail:(d.detail||'').trim(),cost};if(old)Object.assign(old,item);else st.shop.items.push(item);save();closeModal();render();toast('Recompensa salva','positive');break}
case 'profile-form':st.profile.name=d.name.trim().slice(0,40);save();render();toast('Personagem atualizado','positive');break;
case 'diet-form':st.diet=d.diet;save();render();toast('Plano alimentar salvo','positive');break;
}}
function validateImport(x){if(!x||x.app!=='ascensao'||!x.data||!Array.isArray(x.data.tasks)||!Array.isArray(x.data.ledger)||!Array.isArray(x.data.habits)||!Array.isArray(x.data.goals)||!Array.isArray(x.data.workouts)||!Array.isArray(x.data.weights))throw Error('Arquivo não é um backup válido do Ascensão.');if(JSON.stringify(x).length>12_000_000)throw Error('Arquivo excede o limite de importação.');return x.data}
async function handleImport(file){if(!file)return;try{let text=await file.text(),obj=JSON.parse(text),data=validateImport(obj);if(!confirm('Substituir todos os dados atuais pelos dados do backup?'))return;st=normalize(data);save();render();toast('Backup importado com sucesso','positive')}catch(e){toast(e.message||'Não foi possível importar','negative')}}
async function handleLevelImage(file,level){if(!file)return;const n=Number(level);if(!Number.isInteger(n)||!(n===1||(n>=5&&n<=200&&n%5===0)))return;if(file.size>12_000_000||!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Escolha JPG, PNG ou WebP de até 12 MB','negative');return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const c=document.createElement('canvas'),maxW=540,maxH=800,ratio=Math.min(maxW/img.width,maxH/img.height,1),w=Math.max(1,Math.round(img.width*ratio)),h=Math.max(1,Math.round(img.height*ratio));c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);st.profile.levelImages ||= {};st.profile.levelImages[n]=c.toDataURL('image/jpeg',0.72);save();render();toast(`Imagem do nível ${n} salva`,'positive')}catch{toast('Não foi possível salvar a imagem','negative')}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);toast('Não foi possível ler a imagem','negative')};img.src=url}
// Eventos delegados: funcionam mesmo após a atualização de cada página.
document.addEventListener('click',e=>{if(e.target.matches('[data-action="modal-backdrop"]')){closeModal();return}let el=e.target.closest('[data-action]');if(!el||el.dataset.action==='modal-backdrop')return;e.preventDefault();action(el.dataset.action,el)});
document.addEventListener('submit',e=>{const formId=e.target.getAttribute('id');if(!formId)return;e.preventDefault();submitForm(formId,e.target)});
document.addEventListener('change',e=>{if(e.target.id==='import-file')handleImport(e.target.files[0]);if(e.target.dataset.change==='level-upload')handleLevelImage(e.target.files[0],e.target.dataset.level);if(e.target.id==='auto-penalty'){st.settings.autoPenalty=e.target.checked;save();toast(e.target.checked?'Penalidades automáticas ativadas':'Penalidades automáticas desativadas')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(ui.menu){ui.menu=false;render()}}});
// Drag & drop via Pointer Events, compatível com mouse e toque.
let drag=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('.v5-board .task');if(!card||e.button!==0||e.target.closest('button,select,input,textarea,label,a,[contenteditable]'))return;drag={id:card.dataset.taskId,card,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,active:false,origin:card.parentElement}},true);
function resolveDragZone(x,y){const cols=$$('.board-column');const horizontal=cols.length>1&&Math.abs(cols[0].getBoundingClientRect().left-cols[1].getBoundingClientRect().left)>30;const col=cols.find(c=>{const r=c.getBoundingClientRect();return horizontal?x>=r.left&&x<=r.right:y>=r.top-35&&y<=r.bottom+35});return col?.querySelector('.board-drop')||null}
document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.active)e.preventDefault();drag.x=e.clientX;drag.y=e.clientY;if(!drag.active){if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<8)return;drag.active=true;drag.placeholder=document.createElement('div');drag.placeholder.className='task-placeholder';drag.card.replaceWith(drag.placeholder);drag.float=drag.card.cloneNode(true);drag.float.classList.add('drag-float');document.body.append(drag.float);document.body.style.userSelect='none'}drag.float.style.left=`${e.clientX-34}px`;drag.float.style.top=`${e.clientY-35}px`;const zone=resolveDragZone(e.clientX,e.clientY);if(zone){const cards=Array.from(zone.querySelectorAll('.task')).filter(c=>c!==drag.card);const before=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});zone.insertBefore(drag.placeholder,before||null)}},true);
function endDrag(){if(!drag)return;const d=drag;drag=null;if(!d.active)return;const target=resolveDragZone(d.x,d.y);if(target&&d.placeholder.parentElement!==target)target.append(d.placeholder);d.placeholder.replaceWith(d.card);d.float.remove();document.body.style.userSelect='';$$('.board-column').forEach(col=>{const period=col.dataset.period;col.querySelectorAll('.task').forEach((card,i)=>{const t=st.tasks.find(t=>t.id===card.dataset.taskId);if(t){t.period=period;t.order=i}})});save();render();toast('Bloco reorganizado','positive')}
document.addEventListener('pointerup',endDrag,true);document.addEventListener('pointercancel',endDrag,true);

function eventGroup(key='') {
  const p=String(key).split(':')[0];
  return ({task:'mission',habit:'habit',nofap:'nofap',workout:'workout',goal:'goal',shop:'shop',finance:'financial',attribute:'attribute'})[p]||'system';

function ensureV3() {
  if(!st||typeof st!=='object')return;
  st.finance ||= {reserve:{current:0,target:0},items:[]};
  st.finance.reserve ||= {current:0,target:0};
  if(!Array.isArray(st.finance.items))st.finance.items=[];
  st.profile ||= {name:'Caçador',levelImages:{}};
  st.profile.attributes ||= {};
  st.profile.equipment ||= {weapon:{name:'Sem arma equipada',detail:''},armor:{name:'Sem armadura equipada',detail:''}};
  st.profile.equipment.weapon ||= {name:'Sem arma equipada',detail:''};
  st.profile.equipment.armor ||= {name:'Sem armadura equipada',detail:''};
  st.profile.maxLevelReached=Math.max(1,Number(st.profile.maxLevelReached)||1,levelInfo().level);
  if(!Array.isArray(st.activityLog)) {
    st.activityLog = (Array.isArray(st.ledger)?st.ledger:[]).map(e=>({
      id:'legacy-'+String(e.key||uid()),type:eventGroup(e.key),name:String(e.label||'Atividade anterior'),
      delta:Number(e.delta)||0,at:e.at||new Date().toISOString(),detail:'Importado do histórico de XP da versão anterior.'
    })).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  }
  st.version=3;
}

const baseSetLedger = setLedger;
setLedger = function(key,delta,label){
  const previous=st.ledger.find(e=>e.key===key);
  baseSetLedger(key,delta,label);
  if(previous?.delta!==delta || (!previous&&delta)) logActivity(eventGroup(key),label,delta,{reference:key});
};
const baseSave = save;
save = function(){
  ensureV3();

function logActivity(type,name,delta=0,extra={}){
  const item={id:uid(),type,name:String(name||'Atualização').slice(0,250),delta:Number(delta)||0,at:new Date().toISOString(),...extra};
  st.activityLog.unshift(item);
  // Histórico completo no IndexedDB; últimos registros também no backup de emergência do localStorage.
  if(st.activityLog.length>2500)st.activityLog.length=2500;
  allDbHistory.unshift(item);
  queuedEvents.push(item);
  return item;
}
function mergeEvents(items){
  const map=new Map();
  for(const x of [...(items||[]),...(st.activityLog||[]),...allDbHistory]) if(x?.id)map.set(x.id,x);
  return Array.from(map.values()).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
function openDatabase(){
  if(!('indexedDB' in window)){initialDbResolved=true;return}
  let request;
  try{request=indexedDB.open('ascensao_v3',1)}catch{initialDbResolved=true;return}
  request.onupgradeneeded=()=>{
    const db=request.result;
    if(!db.objectStoreNames.contains('snapshot'))db.createObjectStore('snapshot',{keyPath:'key'});
    if(!db.objectStoreNames.contains('events')){
      const ev=db.createObjectStore('events',{keyPath:'id'});
      ev.createIndex('byAt','at',{unique:false});
    }
  };
  request.onerror=()=>{initialDbResolved=true;};
  request.onsuccess=()=>{
    database=request.result;
    const tx=database.transaction(['snapshot','events'],'readonly');
    const r=tx.objectStore('snapshot').get('current');
    const logs=tx.objectStore('events').getAll();
    let dbState=null, dbEvents=[];
    r.onsuccess=()=>{dbState=r.result?.data||null;};
    logs.onsuccess=()=>{dbEvents=logs.result||[];};
    tx.oncomplete=()=>{
      // Priorizar o snapshot mais recente para não perder alterações quando localStorage encheu.
      if(dbState && (!hadLocalData || String(dbState.updatedAt||'')>String(st.updatedAt||''))){
        st=normalize(dbState);ensureV3();
        try{localStorage.setItem(KEY,JSON.stringify(st))}catch{}
      }
      allDbHistory=mergeEvents(dbEvents);
      initialDbResolved=true;
      // Replica registros antigos presentes apenas no localStorage para o novo banco.
      queuedEvents.push(...(st.activityLog||[]).filter(e=>!dbEvents.some(x=>x.id===e.id)));
      persistDatabase();
      render();
    };
  };
}
function persistDatabase(){
  if(!database||dbWriteQueued)return;
  dbWriteQueued=true;
  setTimeout(()=>{
    dbWriteQueued=false;
    try{
      const tx=database.transaction(['snapshot','events'],'readwrite');
      tx.objectStore('snapshot').put({key:'current',data:st});
      const records=queuedEvents.splice(0);
      const ev=tx.objectStore('events');
      for(const item of records)ev.put(item);
      tx.onabort=()=>{queuedEvents.unshift(...records)};
    }catch(e){console.warn('IndexedDB indisponível:',e)}
  },70);
}

function radarSvg(){
  const cx=222,cy=160,r=107,max=Math.max(18,...ATTRIBUTE_DEFS.map(a=>attributeValue(a.id)+3)),N=ATTRIBUTE_DEFS.length;
  const pos=(i,rad)=>{const theta=-Math.PI/2+i*Math.PI*2/N;return [cx+Math.cos(theta)*rad,cy+Math.sin(theta)*rad]};
  const polygon=(ratio)=>ATTRIBUTE_DEFS.map((_,i)=>pos(i,r*ratio).map(n=>n.toFixed(1)).join(',')).join(' ');
  const outer=[.25,.5,.75,1].map(v=>`<polygon points="${polygon(v)}" fill="none" stroke="#41516c" stroke-width="${v===1?1.15:.65}"/>`).join('');
  const axes=ATTRIBUTE_DEFS.map((a,i)=>{const [x,y]=pos(i,r);const [lx,ly]=pos(i,r+26);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#33465c" stroke-width=".8"/><text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" fill="#a3b4cb" font-size="11" text-anchor="middle" font-weight="650">${a.short}</text>`}).join('');
  const points=ATTRIBUTE_DEFS.map((a,i)=>pos(i,r*attributeValue(a.id)/max));
  return `<svg class="radar" viewBox="0 0 445 320" role="img" aria-label="Gráfico radar de atributos de vida real. ${ATTRIBUTE_DEFS.map(a=>a.label+' '+attributeValue(a.id)).join('; ')}"><defs><linearGradient id="radarfill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3bc9ff"/><stop offset="1" stop-color="#a48aff"/></linearGradient></defs>${outer}${axes}<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="#6fb6ff44" stroke="url(#radarfill)" stroke-width="2.5" stroke-linejoin="round"/>${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#8fd6ff"/>`).join('')}</svg>`;
}

function monthsToDeadline(date){
  if(!date)return null;
  if(date<=TODAY())return 0;
  const ms=toDate(date).getTime()-toDate(TODAY()).getTime();
  return Math.max(1,Math.ceil(ms/(86400000*30.44)));
}

async function pictureFile(file){
  if(!file)return '';
  if(file.size>10_000_000 || !['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Envie JPG, PNG ou WebP com até 10 MB.');
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{const ratio=Math.min(780/img.width,680/img.height,1),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.70))}catch{reject(Error('Não foi possível tratar a imagem.'))}finally{URL.revokeObjectURL(url)}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida.'))};img.src=url;
  });
}

const previousSubmitForm=submitForm;
submitForm=function(id,form){
  if(id==='equipment-form'){
    const d=Object.fromEntries(new FormData(form));if(!['weapon','armor'].includes(d.slot))return;
    st.profile.equipment[d.slot]={name:String(d.name||'').trim().slice(0,60),detail:String(d.detail||'').trim().slice(0,200)};
    logActivity('system',`Alterou ${d.slot==='weapon'?'arma':'armadura'} equipada: ${st.profile.equipment[d.slot].name}`);
    save();closeModal();render();toast('Equipamento atualizado','positive');return;
  }
  if(id==='finance-goal-form'){saveFinanceGoal(form);return;}
  if(id==='money-action-form'){
    const d=Object.fromEntries(new FormData(form)),value=moneyValue(d.amount),g=st.finance.items.find(x=>x.id===d.id),r=st.finance.reserve;
    if(!Number.isFinite(value)||value<0||(d.kind!=='reserve-target'&&value===0)){toast('Informe um valor válido','negative');return;}
    if(d.kind==='reserve-target'){r.target=value;logActivity('financial',`Definiu meta da reserva: ${money(value)}`)}

    }else if(d.kind==='finance-deposit'&&g){
      if(g.saved+value>g.price){toast('O aporte supera o que falta para comprar o produto.','negative');return;}
      g.saved=moneyValue(g.saved+value);logActivity('financial',`Economizou ${money(value)} para ${g.name}`,0,{detail:`Total guardado: ${money(g.saved)}`});
    }else return;
    save();closeModal();render();toast('Valor registrado','positive');return;
  }
  // O histórico permanece mesmo se uma configuração ou cadastro mudar posteriormente.
  const before={
    'task-form':'Missão criada ou editada',
    'habit-form':'Hábito criado ou editado',
    'goal-form':'Meta criada ou editada',
    'workout-form':'Exercício criado ou editado',
    'weight-log-form':'Pesagem registrada',
    'weight-goal-form':'Objetivo de peso atualizado',
    'profile-form':'Identidade do personagem atualizada',
    'priority-create-form':'Prioridade adicionada',
    'shop-item-form':'Recompensa criada ou editada',
    'diet-form':'Plano alimentar atualizado'
  };
  // Registra somente se o formulário realmente modificou os dados.
  const oldState=before[id]?JSON.stringify(st):null;
  const fields=before[id]?Object.fromEntries(new FormData(form)):null;
  previousSubmitForm(id,form);
  if(before[id] && JSON.stringify(st)!==oldState){
    const category=id.includes('habit')?'habit':id.includes('task')?'mission':id.includes('goal')?'goal':id.includes('weight')||id.includes('workout')?'workout':'system';
    logActivity(category,`${before[id]}${fields.title||fields.name?': '+(fields.title||fields.name):''}`);
    save();
  }
};

/* ASCENSÃO V4.2 — Missões recorrentes realmente vinculadas aos portais. */
'use strict';

const REPEAT_NAMES={none:'Única',daily:'Diária',weekdays:'Dias úteis',weekly:'Semanal',monthly:'Mensal',interval:'Personalizada'};
const PORTAL_AREAS=[['general','Desenvolvimento pessoal'],['learning','Estudos e conhecimento'],['finances','Finanças'],['constitution','Saúde e corpo'],['mental','Saúde mental'],['oratory','Comunicação'],['family','Família'],['friends','Amizades'],['faith','Fé e espiritualidade'],['career','Carreira']];
function weekStart(d){const x=toDate(d),dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return dateLocal(x)}
function occurrenceKey(t,day=TODAY()){
 const r=t.repeat||'none';
 if(r==='daily'||r==='weekdays')return day;
 if(r==='weekly')return weekStart(day);
 if(r==='monthly')return String(day).slice(0,7);
 if(r==='interval'){
   const anchor=/^\d{4}-\d\d-\d\d$/.test(t.createdAt||'')?t.createdAt:day;
   const days=Math.max(2,Math.min(90,Math.round(Number(t.intervalDays)||7)));
   const delta=Math.max(0,dayDiff(anchor,day));
   return addDays(anchor,Math.floor(delta/days)*days);
 }
 return 'once';
}
function repeatLabel(t){if(t.repeat==='interval')return `A cada ${Math.max(2,Math.min(90,Number(t.intervalDays)||7))} dias`;return REPEAT_NAMES[t.repeat]||'Única'}
function weekend(day=TODAY()){const dayNo=toDate(day).getDay();return dayNo===0||dayNo===6}
function missionStreak(t){
 if(!['daily','weekdays','weekly','monthly','interval'].includes(t.repeat))return 0;
 let count=0,date=TODAY();
 // Inclui o ciclo imediatamente anterior quando o atual ainda não foi marcado.
 for(let i=0;i<180;i++){
  if(t.repeat==='weekdays'&&weekend(date)){date=addDays(date,-1);continue}
  const key=occurrenceKey(t,date);
  if(t.events?.[key]==='done'){count++;}
  else if(i>0||t.events?.[key]==='missed')break;
  if(t.repeat==='weekly')date=addDays(date,-7);
  else if(t.repeat==='monthly'){const d=toDate(date);d.setDate(1);d.setMonth(d.getMonth()-1);date=dateLocal(d)}
  else if(t.repeat==='interval')date=addDays(date,-Math.max(2,Math.min(90,Number(t.intervalDays)||7)));
  else date=addDays(date,-1);
 }
 return count;
}
// A mesma missão vale XP novamente em cada ciclo, sem duplicar XP dentro de um ciclo.
taskStatus=function(t){return t.repeat&&t.repeat!=='none'?(t.events?.[occurrenceKey(t)]||'todo'):(t.status||'todo')};
taskLedgerKey=function(t,d=TODAY()){return `task:${t.id}:${occurrenceKey(t,d)}`};
markTask=function(id,status){const t=st.tasks.find(x=>x.id===id);if(!t)return;
 if(t.repeat==='weekdays'&&weekend()){toast('Esta missão está programada para dias úteis.','negative');return}
 const prev=taskStatus(t),next=prev===status?'todo':status;
 if(t.repeat&&t.repeat!=='none'){
   t.events||={};const k=occurrenceKey(t);if(next==='todo')delete t.events[k];else t.events[k]=next;
 }else t.status=next;
 setLedger(taskLedgerKey(t),next==='done'?taskReward(t):next==='missed'?taskPenalty(t):0,`${t.title} · ${repeatLabel(t)} · ${next}`);
 if(t.goalId?.startsWith('portal:')){
   const portal=st.portals.find(p=>p.id===t.goalId.slice(7));
   if(portal)logActivity('goal',`${next==='done'?'Missão concluída':next==='missed'?'Missão não realizada':'Registro desfeito'} no portal ${portal.name}: ${t.title}`);
 }
 save();render();toast(next==='done'?`+${taskReward(t)} XP · Missão concluída`:next==='missed'?`${taskPenalty(t)} XP · Missão não realizada`:'Registro desfeito',next==='done'?'positive':next==='missed'?'negative':'');
};
const _originalAutoMissesV42=applyAutoMisses;
applyAutoMisses=function(){
 // Preserva a política de penalizações da V3 para missões únicas e diárias.
 // As recorrências novas são calculadas pelo intervalo, com limite para evitar punições retroativas maciças.
 if(!st.settings.autoPenalty){st.lastVisit=TODAY();save();return}
 const today=TODAY(),last=st.lastVisit||today;
 if(last>=today)return;
 let daysToCheck=[];let start=last<addDays(today,-3)?addDays(today,-3):last;
 for(let d=start;d<today;d=addDays(d,1))daysToCheck.push(d);
 for(const t of st.tasks){
   if(!t.repeat||t.repeat==='none'){
     if(t.status!=='done'&&t.status!=='missed'&&t.dueDate&&t.dueDate<today){t.status='missed';setLedger(taskLedgerKey(t),taskPenalty(t),`Missão vencida: ${t.title}`)}
     continue;
   }
   if(t.repeat==='daily'||t.repeat==='weekdays'){
     for(const d of daysToCheck){
       if(t.repeat==='weekdays'&&weekend(d))continue;
       if((t.createdAt||today)>d)continue;
       t.events||={};if(!t.events[d]){t.events[d]='missed';setLedger(taskLedgerKey(t,d),taskPenalty(t),`Missão recorrente não concluída: ${t.title} (${d})`)}
     }
     continue;
   }
   const lastCycle=occurrenceKey(t,last),currentCycle=occurrenceKey(t,today);
   if(lastCycle!==currentCycle){
     const key=lastCycle;
     if(t.createdAt&&t.createdAt>today)continue;
     t.events||={};if(!t.events[key]){t.events[key]='missed';setLedger(`task:${t.id}:${key}`,taskPenalty(t),`Ciclo não concluído: ${t.title}`)}
   }
 }
 st.lastVisit=today;save();
};

const v5BaseMarkTask=markTask;
markTask=function(id,status){const t=st.tasks.find(x=>x.id===id);if(!t)return;
 if(t.period!=='system')return v5BaseMarkTask(id,status);
 const day=TODAY(),old=taskStatus(t),next=old===status?'todo':status;
 t.events||={};if(next==='todo')delete t.events[day];else t.events[day]=next;
 // Limpar registro pré-existente de recompensa / penalidade do ciclo, sem duplicação.
 setLedger(taskLedgerKey(t),next==='done'?taskReward(t):0,`Missão do sistema: ${t.title} • ${next}`);
 if(next==='missed')v5LevelLoss(t,day);else setLedger(`systemfail:${t.id}:${day}`,0,`Falha desfeita: ${t.title}`);
 save();render();toast(next==='done'?`Missão obrigatória concluída! +${taskReward(t)} XP`:next==='missed'?'Missão do sistema não realizada: −1 nível':'Registro alterado',next==='done'?'positive':'negative');
};

applyAutoMisses=function(){
 const today=TODAY(),last=st.lastVisit||today;
 if(!st.settings.autoPenalty){st.lastVisit=today;save();return}
 if(last>=today)return;
 const start=last<addDays(today,-3)?addDays(today,-3):last;
 const days=[];for(let d=start;d<today;d=addDays(d,1))days.push(d);
 for(const t of st.tasks){
   if(t.period==='system')continue;
   if(!t.repeat||t.repeat==='none'){
     if(t.status!=='done'&&t.status!=='missed'&&t.dueDate&&t.dueDate<today){t.status='missed';setLedger(taskLedgerKey(t),taskPenalty(t),`Missão vencida: ${t.title}`)}
   }else if(t.repeat==='daily'||t.repeat==='weekdays'){
     for(const day of days){if(t.repeat==='weekdays'&&weekend(day))continue;if((t.createdAt||today)>day)continue;
       t.events||={};if(!t.events[day]){t.events[day]='missed';setLedger(taskLedgerKey(t,day),taskPenalty(t),`Missão recorrente não realizada: ${t.title} (${day})`)}}
   }else if(occurrenceKey(t,last)!==occurrenceKey(t,today)){
     const cycle=occurrenceKey(t,last);if((t.createdAt||today)>today)continue;
     t.events||={};if(!t.events[cycle]){t.events[cycle]='missed';setLedger(`task:${t.id}:${cycle}`,taskPenalty(t),`Ciclo não concluído: ${t.title}`)}
   }
 }
 for(const day of days){for(const t of st.tasks){if(t.period!=='system'||(t.createdAt||today)>day)continue;
   t.events||={};if(!t.events[day]){t.events[day]='missed';v5LevelLoss(t,day)}}}
 st.lastVisit=today;save();
};

/* ASCENSÃO V6 · arquivo de atualização carregado depois da V5.
   Conserva a chave de armazenamento e os registros anteriores. */
'use strict';
const V6_CAP=100;
const V6_TITLES={10:'Vigilante do Despertar',20:'Guardião dos Propósitos',30:'Domador de Portais',40:'Mestre da Constância',50:'Lenda do Crepúsculo',60:'Sentinela Inabalável',70:'Conquistador do Infinito',80:'Soberano da Vontade',90:'Monarca da Disciplina',100:'Ascendente Supremo'};
const V6_TIER_COLORS={E:'#718ba6',D:'#59c69d',C:'#58b7ff',B:'#8d93ff',A:'#d5a5ff',S:'#f4bc69'};
const v6RawXp=()=>st.ledger.reduce((total,e)=>total+(Number(e.delta)||0),0);
function v6Need(lvl){return Math.round(115+28*lvl+8*Math.pow(lvl,1.78));}
function v6XpStart(lvl){let n=0;for(let i=1;i<Math.min(101,Math.max(1,lvl));i++)n+=v6Need(i);return n;}
function v6OldLevel(total){let n=1,left=Math.max(0,total),need=140;while(left>=need&&n<200){left-=need;n++;need=Math.round(140*Math.pow(n,1.26));}return {level:n,current:left,need};}
function ensureV6(){
 if(!st||typeof st!=='object')return;
 st.profile ||= {};
 if(!Number.isFinite(Number(st.profile.v6XpMigration))){
   const legacy=v6OldLevel(v6RawXp()),lvl=Math.min(V6_CAP,legacy.level),portion=lvl===100?0:Math.floor(v6Need(lvl)*(legacy.current/Math.max(1,legacy.need)));
   st.profile.v6XpMigration=v6XpStart(lvl)+portion-v6RawXp();
 }
 if(!Array.isArray(st.trainingPlans))st.trainingPlans=[];
 if(!Array.isArray(st.gymPhotos))st.gymPhotos=[];
 if(!Array.isArray(st.workouts))st.workouts=[];
 // Compatibilidade: agrupa exercícios anteriores por dia, sem alterar IDs ou históricos de XP.
 const ungrouped=st.workouts.filter(w=>!st.trainingPlans.some(p=>p.id===w.planId));
 const byDay=new Map();
 for(const w of ungrouped){const day=String(w.day||'Sem dia fixo');if(!byDay.has(day)){const p={id:uid(),name:day==='Sem dia fixo'?'Meu treino':`Treino de ${day}`,day,focus:'Condicionamento',duration:'',notes:'Treino recuperado da versão anterior.',createdAt:new Date().toISOString()};st.trainingPlans.push(p);byDay.set(day,p)}w.planId=byDay.get(day).id;}
 for(const w of st.workouts){w.events ||= {};w.gif ||= '';w.rest ||= '';w.tempo ||= '';w.notes ||= '';}
 st.version=6;
}
ensureV6();

// Preserve o nível antigo ao migrar; todo novo XP usa a curva RPG crescente.
xp=function(){return v6RawXp()+(Number(st.profile?.v6XpMigration)||0);};
levelInfo=function(){const total=xp(),effective=Math.max(0,total);let level=1,current=effective;
 while(level<100){const need=v6Need(level);if(current<need)break;current-=need;level++;}
 const need=level===100?0:v6Need(level);
 return {level,current:level===100?0:Math.round(current),need,percent:level===100?100:clamp(100*current/need,0,100),total};
};
rank=function(l){return l>=100?'SS':l>=85?'S':l>=65?'A':l>=45?'B':l>=25?'C':l>=10?'D':'E';};
milestone=function(l){return l<10?1:Math.min(100,Math.floor(l/10)*10);};
nextMilestone=function(l){return Math.min(100,l<10?10:Math.floor(l/10)*10+10);};
characterImage=function(){const images=st.profile.levelImages||{},lv=levelInfo().level;for(let n=milestone(lv);n>=10;n-=10){if(images[n])return images[n];}return images[1]||st.profile.image||'';};
v5CurrentTitle=function(lvl=levelInfo().level){const step=Math.floor(lvl/10)*10;if(step<10)return 'Caçador Desperto';return String(st.profile.titles?.[step]||V6_TITLES[step]||`Lenda do nível ${step}`);};
v5XpToStartLevel=function(level){return v6XpStart(level);};
v5LevelLoss=function(t,day){const current=levelInfo(),targetLevel=Math.max(1,current.level-1),base=v6XpStart(targetLevel),partial=targetLevel===100?0:Math.min(current.current,v6Need(targetLevel)-1);const desired=targetLevel===1?0:base+partial;const delta=current.level>1?Math.min(0,Math.floor(desired-Math.max(0,xp()))):0;
 setLedger(`systemfail:${t.id}:${day}`,delta,`Falha de missão do sistema: ${t.title} (${day}) · 1 nível`);
 logActivity('mission',`Falha no sistema: ${t.title} · ${day}`,delta,{detail:`Nível ${current.level} → ${levelInfo().level}`});
};

customizationPage=function(){const lv=levelInfo().level,levels=[1,...Array.from({length:10},(_,i)=>(i+1)*10)];return `${pageHeading('EVOLUÇÃO / PERSONALIZAÇÃO','Customização','Configure sua identidade. A imagem e o título mudam nos níveis 10, 20, 30... até 100.')}

function v6MissionDoneEntries(){return st.ledger.filter(e=>String(e.key||'').startsWith('task:')&&Number(e.delta)>0).map(e=>{const parts=e.key.split(':'),t=st.tasks.find(t=>t.id===parts[1]);return {id:e.key,task:t,title:t?.title||String(e.label||'Missão concluída').split(' · ')[0],date:parts[2]==='once'?String(e.at||'').slice(0,10):parts[2]||String(e.at||'').slice(0,10),at:e.at,delta:e.delta,priority:t?.priority||'',repeat:t?.repeat||'none',goalId:t?.goalId||'',notes:t?.notes||''};}).sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));}

function v6DoneFilter(e){const pr=ui.v6MissionPriority||'all',kind=ui.v6MissionKind||'all',span=ui.v6MissionSpan||'all',q=String(ui.v6MissionSearch||'').toLocaleLowerCase('pt-BR').trim();if(pr!=='all'&&e.priority!==pr)return false;if(kind!=='all'){if(kind==='system'&&e.task?.period!=='system')return false;if(kind==='portal'&&!e.goalId.startsWith('portal:'))return false;if(kind==='regular'&&e.task?.period==='system')return false;}
 if(span!=='all'&&/^\d+$/.test(span)){const date=e.date||e.at?.slice(0,10);if(date&&dayDiff(date,TODAY())>Number(span))return false;}
 return !q||`${e.title} ${e.notes} ${e.task?.period||''} ${st.portals.find(p=>'portal:'+p.id===e.goalId)?.name||''}`.toLocaleLowerCase('pt-BR').includes(q);}

 ${tab==='done'?`<div class="v6-section-title"><h2>Arquivo de conquistas</h2><p>${done.length} registros encontrados. Missões recorrentes podem aparecer mais de uma vez, conforme cada ciclo.</p></div><div class="v6-done-grid" id="v6-mission-results">${done.length?done.map(e=>`<article class="v6-done-entry" data-search="${esc((e.title+' '+e.notes).toLocaleLowerCase('pt-BR'))}"><div class="v6-done-icon">✓</div><div><h3>${esc(e.title)}</h3><p>${esc(e.date&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)?dateHuman(e.date):'Registro anterior')} · ${esc(e.task?repeatLabel(e.task):'Missão anterior')}${e.goalId.startsWith('portal:')?' · Portal':''}</p></div><span class="tag green">+${Number(e.delta)} XP</span></article>`).join(''):'<div class="v6-empty">Nenhuma conclusão encontrada com esses filtros.</div>'}</div>`:

const v6MediaUrls=new Map();
const v6MediaPromise=new Promise(resolve=>{if(!('indexedDB' in window)){resolve(null);return}let req;try{req=indexedDB.open('ascensao_media_v6',1)}catch{resolve(null);return}req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files',{keyPath:'id'})};req.onerror=()=>resolve(null);req.onsuccess=()=>resolve(req.result);});
async function v6PutBlob(blob,id=uid(),name='arquivo'){const db=await v6MediaPromise;if(!db)throw Error('IndexedDB indisponível. Tente Chrome ou Edge com armazenamento habilitado.');if(blob.size>12_000_000)throw Error('O arquivo deve ter até 12 MB.');return new Promise((resolve,reject)=>{try{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,blob,name,at:new Date().toISOString()});tx.oncomplete=()=>resolve('media:'+id);tx.onerror=()=>reject(Error('Não foi possível gravar a imagem no banco local.'))}catch(e){reject(e)}});}
async function v6GetMedia(id){const db=await v6MediaPromise;if(!db)return null;return new Promise(resolve=>{try{const req=db.transaction('files','readonly').objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch{resolve(null)}});}
async function v6HydrateMedia(){const els=Array.from(document.querySelectorAll('[data-v6-media]'));if(!els.length)return;await Promise.all(els.map(async el=>{const id=el.dataset.v6Media;if(v6MediaUrls.has(id)){if(el.isConnected)el.src=v6MediaUrls.get(id);return}const entry=await v6GetMedia(id);if(entry?.blob){const url=URL.createObjectURL(entry.blob);v6MediaUrls.set(id,url);if(el.isConnected)el.src=url;}else if(el.isConnected){el.alt='Arquivo de imagem não encontrado. Verifique seu backup.';}}));}
async function v6PhotoCompress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12_000_000)throw Error('Envie PNG, JPG ou WebP de até 12 MB.');return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1000/img.width,1000/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(b=>b?resolve(b):reject(Error('Foto não pôde ser processada.')),'image/jpeg',.76)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida.'))};img.src=url;});}
async function v6DeleteMedia(ref){const id=String(ref||'').replace(/^media:/,'');if(!id||!String(ref).startsWith('media:'))return;const db=await v6MediaPromise;if(db)await new Promise(resolve=>{try{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=resolve}catch{resolve()}});if(v6MediaUrls.has(id)){URL.revokeObjectURL(v6MediaUrls.get(id));v6MediaUrls.delete(id);}}
async function v6MediaAll(){const db=await v6MediaPromise;if(!db)return [];return new Promise(resolve=>{try{const q=db.transaction('files','readonly').objectStore('files').getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>resolve([])}catch{resolve([])}});}
function v6ToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Falha ao converter imagem para backup.'));r.readAsDataURL(blob)});}
async function v6MediaRestore(items){const db=await v6MediaPromise;if(!db){if(items.length)toast('Não foi possível restaurar as imagens sem IndexedDB.','negative');return}await new Promise(resolve=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=resolve;tx.onerror=resolve});for(const item of items){if(!item?.id||!/^data:image\/(gif|jpeg|png|webp);base64,/.test(item.data||''))continue;try{const blob=await (await fetch(item.data)).blob();await v6PutBlob(blob,String(item.id),String(item.name||'imagem'))}catch{}}for(const url of v6MediaUrls.values())URL.revokeObjectURL(url);v6MediaUrls.clear();}

 switch(name){
 case 'v6-tab':{const section=el.dataset.section,tab=el.dataset.tab;if(!['v6MissionTab','v6PortalTab'].includes(section)||!['active','done'].includes(tab))return;ui[section]=tab;render();return;}

 case 'v6-test-reset':{const entries=st.ledger.filter(e=>String(e.key).startsWith('v6test:'));if(!entries.length){toast('Sem ajustes de teste para desfazer.');return}if(!confirm('Desfazer todos os ajustes manuais de nível e XP feitos no laboratório?'))return;st.ledger=st.ledger.filter(e=>!String(e.key).startsWith('v6test:'));logActivity('system',`Desfez ${entries.length} ajustes manuais de teste`);save();render();toast('Ajustes manuais removidos','positive');return;}

function v8FmtDate(d){return /\d{4}-\d\d-\d\d/.test(d||'')?toDate(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'Sem data'}
function v8ValidDate(d){return /^\d{4}-\d\d-\d\d$/.test(d||'')}
function v8When(t,date=TODAY()){
 if(t.period==='system' && t.repeat==='none')return date===TODAY();
 const start=t.scheduleDate||t.dueDate||t.createdAt||TODAY();
 if(date<start)return false;
 const repeat=t.repeat||'none';
 if(repeat==='daily')return true;
 if(repeat==='weekdays')return !weekend(date);
 if(repeat==='weekly')return toDate(date).getDay()===toDate(start).getDay();
 if(repeat==='monthly'){const d=toDate(date),s=toDate(start);return d.getDate()===Math.min(s.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate());}
 if(repeat==='interval'){const interval=clamp(Number(t.intervalDays)||7,2,90);return dayDiff(start,date)%interval===0;}
 if(t.completionDate)return t.completionDate===date;
 return start===date || (!t.dueDate&&!t.scheduleDate&&date===TODAY());
}
function v8Status(t,date=TODAY()){
 if(t.repeat&&t.repeat!=='none')return t.events?.[occurrenceKey(t,date)]||'todo';
 return t.status||'todo';
}
function v8Effective(t,date){const s=v8Status(t,date);return s==='todo'&&date<TODAY()&&v8When(t,date)?'overdue':s;}
function v8SetTask(id,date,kind){
 const t=st.tasks.find(x=>x.id===id);if(!t)return;
 if(date>TODAY() && kind!=='todo'){toast('Não é possível concluir uma missão futura.','negative');return;}
 if(t.repeat==='weekdays'&&weekend(date)){toast('Missão programada para dias úteis.','negative');return;}
 const s=kind==='done'?'done':kind==='missed'?'missed':'todo';
 if(t.repeat&&t.repeat!=='none'){
  t.events||={};let k=occurrenceKey(t,date);if(s==='todo')delete t.events[k];else t.events[k]=s;
 }else{
  t.status=s;t.completionDate=s==='done'?date:'';
 }
 setLedger(taskLedgerKey(t,date),s==='done'?taskReward(t):s==='missed'?taskPenalty(t):0,`${t.title} • ${s} (${date})`);
 if(t.period==='system'&&s==='missed')v5LevelLoss(t,date);
 else if(t.period==='system')setLedger(`systemfail:${t.id}:${date}`,0,`Falha revertida: ${t.title}`);
 logActivity('mission',`${s==='done'?'Concluiu':s==='missed'?'Não realizou':'Reabriu'} ${t.title} em ${date}`);
 save();render();toast(s==='done'?'Missão concluída':s==='missed'?'Missão não realizada':'Missão recuperada',s==='done'?'positive':'');
}
