dashboard=function(){v9Ensure();v9Unlock();const root=document.createElement('div');root.innerHTML=v9OldDashboard();root.querySelectorAll('[data-pillar]').forEach(input=>{const id=input.dataset.pillar,grade=v9Grade(st.profile.pillars[id]);const sel=document.createElement('select');sel.className='v9-grade-picker';sel.dataset.v9Pillar=id;sel.setAttribute('aria-label','Avaliação do pilar '+(V5_PILLARS.find(p=>p.id===id)?.label||id));sel.innerHTML=V9_GRADES.map(([title,value])=>`<option value="${value}" ${value===grade[1]?'selected':''}>${title}</option>`).join('');const holder=input.closest('.v5-pillar-slider');if(holder)holder.innerHTML=sel.outerHTML;});root.querySelectorAll('.v5-pillar-heading p').forEach(p=>p.textContent='Avalie cada área com palavras. O gráfico acompanha suas respostas; não há pontos para distribuir.');root.querySelectorAll('.v5-scale-chip').forEach(e=>e.textContent='8 níveis de avaliação');const earned=v9AllBadges();root.insertAdjacentHTML('beforeend',`<section class="v9-achievements-home v9-panel"><div class="v9-section-head"><div><div class="eyebrow">CONQUISTAS</div><h2>Minhas insígnias</h2><p>${earned.length} conquista${earned.length===1?'':'s'} registrada${earned.length===1?'':'s'}</p></div><button class="btn ghost" data-action="nav" data-page="achievements">Gerenciar conquistas</button></div><div class="v9-badge-grid">${earned.length?earned.slice(0,8).map(v9Badge).join(''):'<p class="muted">Suas medalhas aparecerão aqui à medida que você completar os desafios configurados.</p>'}</div></section>`);return root.innerHTML;};
function v9AchievementsPage(){v9Ensure();v9Unlock();const q=String(ui.v9AchSearch||'').toLowerCase(),filter=ui.v9AchFilter||'all',items=st.achievements.filter(a=>(filter==='all'||(filter==='earned'?!!a.awardedAt:!a.awardedAt))&&`${a.name} ${a.description}`.toLowerCase().includes(q));return `${pageHeading('GALERIA / RECONHECIMENTO','Medalhas e conquistas','Crie suas próprias insígnias e determine as condições para desbloqueá-las.',`<button class="btn primary" data-action="v9-ach-add">＋ Criar conquista</button>`)}<div class="v9-top-summary"><div><b>${st.achievements.length}</b><span>Conquistas configuradas</span></div><div><b>${st.achievements.filter(a=>a.awardedAt).length}</b><span>Conquistas desbloqueadas</span></div><div><b>${v9AllBadges().length}</b><span>Insígnias na coleção</span></div></div><div class="v8-toolbar"><label>Pesquisar<input type="search" id="v9-ach-search" value="${esc(ui.v9AchSearch||'')}" placeholder="Buscar conquista..."></label><label>Exibir<select id="v9-ach-filter">${options([['all','Todas'],['earned','Desbloqueadas'],['locked','A conquistar']],filter)}</select></label></div><div class="v9-achievement-grid">${items.map(a=>{const count=v9Count(a.trigger,a.habitId),pct=a.trigger==='manual'?(a.awardedAt?100:0):Math.min(100,Math.round(count/a.target*100));return `<article class="v9-ach-card ${a.awardedAt?'earned':''}" style="--badge:${esc(a.color)}"><div class="v9-ach-image">${a.image?`<img src="${esc(a.image)}" alt="Imagem da conquista ${esc(a.name)}">`:'<span>✦</span>'}</div><div class="v9-ach-body"><span class="tag ${a.awardedAt?'green':'purple'}">${a.awardedAt?'✓ Conquistada':'Em andamento'}</span><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p><small>${esc(V9_TRIGGERS.find(x=>x[0]===a.trigger)?.[1]||'Manual')}${a.habitId?' · '+esc(st.habits.find(h=>h.id===a.habitId)?.name||'Hábito excluído'):''}</small><div class="progress"><span style="width:${pct}%"></span></div><div class="v9-ach-meta"><b>${a.trigger==='manual'?(a.awardedAt?'Desbloqueada':'Aguardando liberação'):`${Math.min(count,a.target)} / ${a.target}`}</b>${a.awardedAt?`<span>${v8FmtDate(a.awardedAt.slice(0,10))}</span>`:''}</div><div class="inline-actions"><button class="btn ghost tiny-btn" data-action="v9-ach-edit" data-id="${esc(a.id)}">Editar</button>${a.trigger==='manual'?`<button class="btn tiny-btn ${a.awardedAt?'ghost':'success'}" data-action="v9-ach-manual" data-id="${esc(a.id)}">${a.awardedAt?'Bloquear':'Conceder'}</button>`:''}<button class="btn danger tiny-btn" data-action="v9-ach-delete" data-id="${esc(a.id)}">Excluir</button></div></div></article>`;}).join('')||'<div class="v8-empty-drop">Nenhuma conquista neste filtro.</div>'}</div><section class="v9-panel" style="margin-top:20px"><h2>Medalhas dos ciclos de hábitos</h2><div class="v9-badge-grid">${v9AllBadges().filter(a=>a.type==='cycle').map(v9Badge).join('')||'<p class="muted">Medalhas de ciclos completos de 90 dias aparecerão automaticamente aqui.</p>'}</div></section>`;}
function v9AchievementModal(id){const a=st.achievements.find(x=>x.id===id)||{id:'',name:'',description:'',trigger:'missions',target:10,habitId:'',color:'#a88aed',image:'',awardedAt:''};showModal(id?'Editar conquista':'Criar conquista',`<input type="hidden" name="id" value="${esc(a.id)}"><div class="v9-ach-preview" style="--badge:${esc(a.color)}">${a.image?`<img src="${esc(a.image)}" alt="Prévia da insígnia">`:'✦'}</div><div class="form-grid"><div class="field full"><label>Nome da conquista *</label><input required name="name" maxlength="80" value="${esc(a.name)}"></div><div class="field full"><label>Descrição</label><textarea name="description" maxlength="360">${esc(a.description||'')}</textarea></div><div class="field"><label>Condição de desbloqueio</label><select name="trigger" id="v9-ach-trigger">${options(V9_TRIGGERS,a.trigger)}</select></div><div class="field"><label>Quantidade ou valor necessário</label><input type="number" name="target" min="1" max="10000000" step="1" value="${a.target}"></div><div class="field"><label>Hábito específico (opcional)</label><select name="habitId">${options([['','Todos os hábitos'],...st.habits.map(h=>[h.id,h.name])],a.habitId)}</select></div><div class="field"><label>Cor da conquista</label><input name="color" type="color" value="${esc(a.color||'#a88aed')}"></div><div class="field full"><label>Imagem da insígnia · proporção 1:1 (opcional)</label><input name="badgeFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><span class="tiny">A imagem será exibida em quadro quadrado, sem esticar. GIFs animados são aceitos (até 2 MB).</span></div></div>${a.image?`<button class="btn ghost tiny-btn" type="button" data-action="v9-ach-remove-image" data-id="${esc(a.id)}">Remover imagem</button>`:''}`,'v9-ach-form');}
function v9TaskMatches(t,date){const q=String(ui.v8Search||'').toLowerCase().trim(),status=ui.v8Status||'all',p=ui.v8Priority||'all';const s=v8Effective(t,date);return(!q||`${t.title} ${t.notes||''}`.toLowerCase().includes(q))&&(p==='all'||t.priority===p)&&(status==='all'||(status==='todo'?s==='todo':s===status));}
function v9BoardNav(active){return `<div class="v8-tabbar v9-tabs">${[['missions','Diário'],['weekly','Semanal'],['kanban','Kanban'],['missionarchive','Concluídas'],['calendar','Calendário']].map(([pg,title])=>`<button class="v8-tab ${active===pg?'active':''}" data-action="nav" data-page="${pg}">${title}</button>`).join('')}</div>`;}
function v9Widths(context){const value=st.settings.v9BoardSizes?.[context]||'medium';return value==='narrow'?240:value==='wide'?400:300;}
function v9ColumnHTML({id,name,count,color,fill,drop,body,context='day',add=true,subtitle=''}){const width=v9Widths(context);return `<section class="v9-board-col" data-v8-drop="${esc(drop)}" style="--v8-accent:${esc(color)};--v9-fill:${esc(fill||'transparent')};--v9-colwidth:${width}px"><div class="v9-col-top"><div><h3><span class="v9-col-dot"></span>${esc(name)}</h3><small>${count} cartão${count===1?'':'ões'}${subtitle?' · '+esc(subtitle):''}</small></div>${add?`<button class="btn ghost tiny-btn" data-action="v9-column-add" data-id="${esc(id)}" data-context="${context}" title="Nova missão">＋</button>`:''}</div><div class="v9-col-body">${body||'<div class="v8-empty-drop">Arraste suas missões para cá</div>'}</div></section>`;}
function v9SystemHTML(date){const system=st.tasks.filter(t=>t.period==='system'&&v8When(t,date)&&v8Status(t,date)!=='done'&&v9TaskMatches(t,date));return `<section class="v8-system-panel v9-system-board" data-v8-drop="system"><div class="v8-system-header"><div><div class="eyebrow">PRIORIDADE ABSOLUTA</div><h2>Missões do Sistema</h2><p>Obrigatórias diariamente · falha registrada custa um nível.</p></div><button class="btn primary" data-action="task-add" data-period="system">＋ Obrigatória</button></div><div class="v8-system-cards">${system.map(t=>v8Card(t,date)).join('')||'<p class="muted">Nenhuma missão obrigatória pendente.</p>'}</div></section>`;}
function v9QuickAddUI(){return `<form id="v9-quick-form" class="v9-quick-form"><div><strong>Entrada rápida de missões</strong><small>Escreva várias atividades separadas por vírgulas. Cada trecho vira um cartão para hoje.</small></div><div class="v9-quick-controls"><input type="text" name="items" required maxlength="2000" placeholder="Estudar inglês, fazer compras, caminhar 30 minutos..."><button class="btn primary" type="submit">＋ Adicionar</button></div></form>`;}
function v9DayPage(){v9Ensure();const d=ui.v8Date||TODAY(),s=st.settings;return `${pageHeading('EXECUÇÃO / ROTINA','Organização diária','Distribua suas tarefas entre manhã, tarde e noite no formato de quadro.',`<button class="btn primary" data-action="v8-task-add" data-part="morning">＋ Nova missão</button>`)}${v9BoardNav('missions')}${v9QuickAddUI()}<div class="v8-date-row"><label>Dia <input type="date" id="v8-date" value="${d}"></label><button class="btn ghost" data-action="v8-today">Hoje</button><button class="btn ghost" data-action="v9-cols" data-context="day">Aparência das colunas</button><button class="btn ${s.v8Lock?'success':'ghost'}" data-action="v8-lock">${s.v8Lock?'🔒 Bloqueado':'🔓 Bloquear layout'}</button></div>${v8TaskFilters()}${v9SystemHTML(d)}<div class="v9-board" role="group" aria-label="Quadro de missões do dia">${s.v8DayOrder.map(p=>{const meta=V8_PARTS.find(x=>x[0]===p),items=st.tasks.filter(t=>t.period!=='system'&&(t.dayPart||'morning')===p&&v8When(t,d)&&v8Status(t,d)!=='done'&&v9TaskMatches(t,d)).sort((a,b)=>(a.order||0)-(b.order||0));return v9ColumnHTML({id:p,name:s.v9DayNames[p]||meta[1],count:items.length,color:s.v8DayColors[p]||meta[2],fill:s.v9DayFill[p],drop:'part:'+p,body:items.map(t=>v8Card(t,d)).join(''),context:'day'});}).join('')}</div><p class="tiny">Arraste pelo corpo do cartão. No celular, pressione por um instante. O cadeado impede mover e alterar as colunas.</p>`;}
function v9WeekMonday(date){const d=toDate(date),day=(d.getDay()+6)%7;return addDays(date,-day);}
function v9WeeklyPage(){v9Ensure();const s=st.settings,reference=ui.v9WeekDate||ui.v8Date||TODAY(),start=v9WeekMonday(reference),end=addDays(start,6);return `${pageHeading('PLANEJAMENTO / SEMANA','Organização semanal','Veja a semana inteira e mova cartões entre os dias.',`<button class="btn primary" data-action="v9-week-add">＋ Nova tarefa</button>`)}${v9BoardNav('weekly')}<div class="v8-date-row"><button class="btn ghost" data-action="v9-week-shift" data-delta="-7">← Semana anterior</button><label>Semana de referência<input type="date" id="v9-week-date" value="${reference}"></label><button class="btn ghost" data-action="v9-week-shift" data-delta="7">Próxima semana →</button><button class="btn ghost" data-action="v9-week-today">Esta semana</button><button class="btn ghost" data-action="v9-cols" data-context="week">Aparência</button><button class="btn ${s.v8Lock?'success':'ghost'}" data-action="v8-lock">${s.v8Lock?'🔒 Bloqueado':'🔓 Bloquear'}</button></div>${v8TaskFilters()}<div class="v9-week-caption">${v8FmtDate(start)} — ${v8FmtDate(end)}. Missões recorrentes aparecem em cada ocorrência programada.</div><div class="v9-board v9-week-board">${s.v9WeekOrder.map(i=>{const date=addDays(start,i),items=st.tasks.filter(t=>t.period!=='system'&&v8When(t,date)&&v8Status(t,date)!=='done'&&v9TaskMatches(t,date));return v9ColumnHTML({id:date,name:s.v9WeekNames[i]||V9_WEEK[i],count:items.length,color:s.v9WeekColors[i],fill:s.v9WeekFill[i],drop:'week:'+date,body:items.map(t=>v8Card(t,date)).join(''),context:'week',subtitle:v8FmtDate(date)});}).join('')}</div><p class="tiny">Ao mover uma tarefa recorrente, o dia-base da recorrência será alterado. As ocorrências anteriores continuam registradas.</p>`;}
const v9OldKanban=v8KanbanPage;
v8KanbanPage=function(){const html=v9OldKanban().replace(/<div class="v8-tabbar">[\s\S]*?<\/div>/,v9BoardNav('kanban')).replace('data-action="v8-kanban-config"','data-action="v9-cols" data-context="kanban"');const root=document.createElement('div');root.innerHTML=html;root.querySelectorAll('.v8-kanban-col').forEach((el,i)=>{const c=st.settings.v8Kanban[i];if(c){el.classList.add('v9-colored-col');el.style.setProperty('--v9-fill',c.fill||'transparent');}});return root.innerHTML;};
function v9ColumnsModal(context){v9Ensure();if(st.settings.v8Lock){toast('Desbloqueie o layout para personalizar.','negative');return;}const s=st.settings;const entries=context==='kanban'?s.v8Kanban.map((c,i)=>({id:c.id,name:c.name,color:c.color,fill:c.fill||'#161e32',i})):context==='day'?s.v8DayOrder.map((id,i)=>({id,name:s.v9DayNames[id]||V8_PARTS.find(p=>p[0]===id)[1],color:s.v8DayColors[id],fill:s.v9DayFill[id]||'#161e32',i})):s.v9WeekOrder.map((id,i)=>({id:String(id),name:s.v9WeekNames[id]||V9_WEEK[id],color:s.v9WeekColors[id],fill:s.v9WeekFill[id]||'#161e32',i}));const width=context==='kanban'?'':`<div class="field"><label>Largura das colunas</label><select name="size">${options([['narrow','Compacta'],['medium','Média'],['wide','Larga']],s.v9BoardSizes[context]||'medium')}</select></div>`;showModal('Personalizar '+(context==='day'?'organização diária':context==='week'?'organização semanal':'Kanban'),`<input name="context" type="hidden" value="${context}"><p class="muted">Personalize a cor de destaque e a cor de fundo de cada coluna. Use as setas para reorganizar.</p>${width}<div class="v9-col-editor">${entries.map((c,i)=>`<div class="v9-col-editor-row"><div class="v9-col-reorder"><button type="button" class="btn ghost tiny-btn" data-action="v9-col-order" data-context="${context}" data-id="${c.id}" data-delta="-1" ${i===0?'disabled':''}>↑</button><button type="button" class="btn ghost tiny-btn" data-action="v9-col-order" data-context="${context}" data-id="${c.id}" data-delta="1" ${i===entries.length-1?'disabled':''}>↓</button></div><label>${esc(c.name)}<input name="name_${esc(c.id)}"  maxlength="38" value="${esc(c.name)}"></label><label>Cor da borda<input type="color" name="color_${esc(c.id)}" value="${esc(c.color||'#8a80c0')}"></label><label>Fundo da coluna<input type="color" name="fill_${esc(c.id)}" value="${esc(c.fill||'#151a30')}"></label></div>`).join('')}</div>${context==='kanban'?'<button type="button" class="btn ghost" data-action="v9-col-add">＋ Nova coluna</button>':''}<h3 style="margin-top:18px">Informações exibidas nos cartões</h3><div class="v9-fields-grid">${Object.entries(V8_FIELDS).map(([key,label])=>`<label><input type="checkbox" name="field_${key}" ${s.v8Fields[key]?'checked':''}> ${esc(label)}</label>`).join('')}</div><p class="tiny">As cores são suavizadas automaticamente no modo claro para preservar a leitura.</p>`,'v9-col-form');}
function v9SettingsPage(){const root=document.createElement('div');root.innerHTML=settings();root.querySelectorAll('h1').forEach(h=>h.textContent='Configurações e dados');root.insertAdjacentHTML('afterbegin',`<div class="v9-settings-jumps"><button class="btn ghost" data-action="v9-setting-tab" data-tab="general">⚙ Preferências</button><button class="btn ghost" data-action="v9-setting-tab" data-tab="custom">✦ Customização do personagem</button><button class="btn ghost" data-action="v9-setting-tab" data-tab="history">▤ Histórico de dados</button><button class="btn ghost" data-action="v9-setting-tab" data-tab="testing">⚗ Laboratório</button></div>`);const tab=ui.v9SettingsTab||'general';if(tab==='custom')return `${pageHeading('PERSONALIZAÇÃO','Configurações e dados','Defina os títulos e os retratos de seu personagem. GIFs animados são aceitos.')}${root.querySelector('.v9-settings-jumps')?.outerHTML||''}${v9CustomizationHTML()}`;if(tab==='history')return `${pageHeading('BANCO LOCAL','Configurações e dados','Consulte o histórico preservado no navegador.')}${root.querySelector('.v9-settings-jumps')?.outerHTML||''}${historyPage()}`;if(tab==='testing')return `${pageHeading('ÁREA TEMPORÁRIA','Configurações e dados','Ferramentas de testes de nível e XP.')}${root.querySelector('.v9-settings-jumps')?.outerHTML||''}${testingPage()}`;return root.innerHTML;}
function v9CustomizationHTML(){return customizationPage().replaceAll('accept="image/png,image/jpeg,image/webp"','accept="image/png,image/jpeg,image/webp,image/gif"').replace('Fotos a cada 10 níveis','Fotos ou GIFs a cada 10 níveis')+`<p class="tiny">GIFs animados de perfil preservam os quadros originais quando importados sem compressão. Prefira arquivos pequenos.</p>`;}
const v9OldRender=render;
render=function(){v9Ensure();v9Unlock();v9OldRender();const names={weekly:'Organização semanal',achievements:'Medalhas e conquistas'};let main=document.querySelector('main.main');if(main&&names[ui.page]){const h=main.querySelector('header.topbar');main.innerHTML=h.outerHTML+(ui.page==='weekly'?v9WeeklyPage():v9AchievementsPage());document.title=names[ui.page]+' · ASCENSÃO V9';}if(main&&ui.page==='settings'){const h=main.querySelector('header.topbar');main.innerHTML=h.outerHTML+v9SettingsPage();}const bar=document.querySelector('.sidebar .nav-list');if(bar){/* A barra é construída por grupos em side() redefinido. */}document.title=document.title.replace('V8','V9');};
side=function(){const lv=levelInfo();const groups=[['PRINCIPAL',[['dashboard','◈','Personagem'],['achievements','✦','Conquistas']]],['ORGANIZAÇÃO',[['missions','▦','Organização diária'],['weekly','▥','Organização semanal'],['kanban','▤','Kanban'],['calendar','▦','Calendário e dados']]],['PROGRESSO',[['goals','◎','Portais e metas'],['habits','⚑','Hábitos a evitar'],['gym','⬡','Academia'],['finance','◉','Finanças']]],['SISTEMA',[['settings','⚙','Configurações e dados']]]];return `<aside class="sidebar ${ui.menu?'open':''}"><div class="brand"><span class="brand-mark">A</span><div><div class="brand-name">ASCENSÃO</div><small>SISTEMA DO CAÇADOR</small></div></div>${groups.map(([name,links])=>`<div class="nav-label v9-nav-heading">${name}</div><nav class="nav-list">${links.map(x=>navLink(...x)).join('')}</nav>`).join('')}<div class="side-bottom"><div class="side-rank"><div class="spread"><div><div class="upper">RANK ATUAL</div><strong>Rank ${rank(lv.level)}</strong></div><span class="phase-label">LVL ${lv.level}</span></div><div class="xp-label" style="margin-top:16px"><span>Experiência</span><span>${lv.current} / ${lv.need} XP</span></div><div class="progress"><span style="width:${lv.percent}%"></span></div></div><div class="side-footer">Seus dados ficam neste navegador. Exporte um backup em Configurações.</div></div></aside>`;};

 const board=d.card.closest('.v9-board,.v8-kanban')||document.querySelector('.v9-board,.v8-kanban');if(board){const r=board.getBoundingClientRect();if(d.x>=r.left&&d.x<=r.right){if(d.x>r.right-edge)board.scrollLeft+=Math.min(24,2+(d.x-(r.right-edge))/5);else if(d.x<r.left+edge)board.scrollLeft-=Math.min(24,2+(r.left+edge-d.x)/5);}}

function v12ScheduleUpload(){clearTimeout(v12DriveTimer);v12DriveTimer=setTimeout(()=>{if(v12Token&&st.settings.v12Drive.auto&&v12Dirty)v12Upload(false).catch(err=>v12DriveError(err));},12000);}
function v12DriveUiUpdate(note){v12DriveNote=note;const box=document.getElementById('v12-drive-status');if(box)box.innerHTML=v12GetStatusLine();}
function v12DriveError(err){console.warn('Falha Google Drive:',err);v12DriveUiUpdate('Erro: '+(err?.message||'Falha de rede'));toast('Drive: '+(err?.message||'Não foi possível sincronizar'),'negative');}
function v12GisReady(){return !!(window.google?.accounts?.oauth2?.initTokenClient);}
function v12ConnectDrive(){
 v12Ensure();const clientId=st.settings.v12Drive.clientId.trim();
 if(!clientId)return toast('Informe e salve primeiro o ID OAuth do Google Cloud.','negative');
 if(!(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))return toast('Abra este app via HTTPS ou localhost para conectar o Google Drive.','negative');
 if(!v12GisReady()){
  if(!document.querySelector('#v12-gis-sdk')){
   const script=document.createElement('script');script.id='v12-gis-sdk';script.src='https://accounts.google.com/gsi/client';script.async=true;script.onload=()=>v12DriveUiUpdate('Biblioteca Google pronta. Clique em Conectar novamente.');script.onerror=()=>v12DriveUiUpdate('Não foi possível carregar o login Google. Confira sua internet.');document.head.appendChild(script);
  }
  toast('Carregando o login Google. Clique em Conectar novamente quando estiver pronto.');return;
 }
 try{
  v12TokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:V12_DRIVE_SCOPE,callback:async result=>{
   if(result.error)return v12DriveError(Error(result.error_description||result.error));
   v12Token=result.access_token||'';v12RemoteId='';v12RemoteVersion='';
   v12DriveUiUpdate('Autorização concedida. Escolha enviar ou restaurar uma cópia.');render();
   try{const files=await v12DriveList();const f=files[0];if(f){v12RemoteId=f.id;v12DriveUiUpdate('Existe um backup na nuvem, atualizado em '+new Date(f.modifiedTime).toLocaleString('pt-BR')+'. Escolha restaurar ou substituir.');}else v12DriveUiUpdate('Conectado. Nenhum backup encontrado: pode enviar o primeiro.');}catch(err){v12DriveError(err);}
  }});
  v12TokenClient.requestAccessToken({prompt:'consent'});
 }catch(err){v12DriveError(err);}
}
async function v12Api(path,opts={}){
 if(!v12Token)throw Error('Conecte-se ao Google antes de sincronizar.');
 const headers=new Headers(opts.headers||{});headers.set('Authorization','Bearer '+v12Token);
 const response=await fetch('https://www.googleapis.com'+path,{...opts,headers});
 if(!response.ok){let msg;try{const o=await response.json();msg=o.error?.message}catch{}if(response.status===401){v12Token='';v12DriveUiUpdate('A autorização expirou. Conecte novamente.');}
  throw Error(msg||('HTTP '+response.status));}
 return response;
}
async function v12DriveList(){
 const params=new URLSearchParams({spaces:'appDataFolder',q:"name = '"+V12_DRIVE_FILE+"' and trashed = false",fields:'nextPageToken,files(id,name,modifiedTime,size)',pageSize:'100'});
 const r=await v12Api('/drive/v3/files?'+params);const value=await r.json();return (value.files||[]).sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)));
}
async function v12BuildBackup(){
 const media=await v6MediaAll(),files=[];
 for(const m of media){try{files.push({id:m.id,name:m.name,data:await v6ToDataURL(m.blob)})}catch{}}
 return {app:'ascensao',version:12,exportedAt:new Date().toISOString(),data:{...st,activityLog:await allStoredEvents()},media:files};
}
async function v12Export(){const contents=await v12BuildBackup(),body=new Blob([JSON.stringify(contents)],{type:'application/json'});const url=URL.createObjectURL(body),a=document.createElement('a');a.href=url;a.download='ascensao-v12-backup-'+TODAY()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);v12Dirty=false;try{localStorage.setItem('ascensao_v12_last_backup',String(Date.now()))}catch{}toast('Backup completo baixado. Guarde o arquivo em local seguro.','positive');return true;}
exportV3=v12Export;
async function v12Upload(manual){
 if(v12DriveBusy)return;if(!v12Token)throw Error('Conecte o Google Drive antes.');
 v12DriveBusy=true;v12DriveUiUpdate('Enviando backup completo...');
 try{
  const files=await v12DriveList();let remote=files[0];
  if(remote){
   const other=!!v12RemoteVersion&&remote.modifiedTime!==v12RemoteVersion;
   if(other){v12DriveUiUpdate('CONFLITO: backup remoto mudou. Restaure ou substitua manualmente.');if(!manual)throw Error('Existe uma versão mais recente na nuvem. Sincronização automática pausada.');if(!confirm('A cópia do Google Drive mudou desde sua última sincronização. Substituir mesmo assim?'))return;}
   if(!v12RemoteVersion){if(!manual){v12DriveUiUpdate('O Drive já tem um backup. Escolha manualmente antes de ativar o envio automático.');return;}
    if(!confirm('Já existe um backup no Drive. Substituir pelo conteúdo deste navegador?'))return;}
  }
  const revisionAtStart=v12Revision;const backup=await v12BuildBackup(),json=JSON.stringify(backup);
  if(json.length>100_000_000)throw Error('Backup maior que 100 MB. Reduza mídias muito grandes.');
  if(!remote){
   const res=await v12Api('/drive/v3/files?fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:V12_DRIVE_FILE,mimeType:'application/json',parents:['appDataFolder']})});remote=await res.json();
  }
  const update=await v12Api('/upload/drive/v3/files/'+encodeURIComponent(remote.id)+'?uploadType=media&fields=id,name,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:json});const updated=await update.json();
  v12RemoteId=updated.id;v12RemoteVersion=updated.modifiedTime;v12Dirty=v12Revision!==revisionAtStart;
  v12DriveUiUpdate('Backup no Google Drive atualizado em '+new Date().toLocaleString('pt-BR'));
  toast('Backup salvo no Google Drive.','positive');
 }finally{v12DriveBusy=false;if(v12Dirty&&v12Token&&st.settings.v12Drive.auto)v12ScheduleUpload();}
}
async function v12Download(){
 if(!v12Token)throw Error('Conecte o Google Drive antes.');if(v12DriveBusy)return;
 v12DriveBusy=true;try{
  const files=await v12DriveList();if(!files.length)throw Error('Nenhum backup encontrado no Drive.');const remote=files[0];
  if(!confirm('Restaurar backup do Drive (de '+new Date(remote.modifiedTime).toLocaleString('pt-BR')+') e SUBSTITUIR os dados locais? Faça um backup local antes.'))return;
  v12DriveUiUpdate('Baixando e restaurando backup...');
  const response=await v12Api('/drive/v3/files/'+encodeURIComponent(remote.id)+'?alt=media');const json=await response.text();if(json.length>100_000_000)throw Error('Arquivo muito grande para restaurar.');
  const obj=JSON.parse(json);const data=validateImport(obj);
  const originalDrive={...st.settings.v12Drive};const originalWarning=st.settings.v12WarnOnExit;
  st=normalize(data);ensureV3();ensureV6();v11Ensure();v12Ensure();st.settings.v12Drive=originalDrive;st.settings.v12WarnOnExit=originalWarning;allDbHistory=[];queuedEvents=[];
  if(database){try{const tx=database.transaction(['snapshot','events'],'readwrite');tx.objectStore('events').clear();tx.objectStore('snapshot').clear();}catch{}}
  queuedEvents.push(...(st.activityLog||[]));await v6MediaRestore(Array.isArray(obj.media)?obj.media:[]);
  v12RemoteId=remote.id;v12RemoteVersion=remote.modifiedTime;v12BackupMuted=true;save();v12BackupMuted=false;v12Dirty=false;ui.page='data';render();
  v12DriveUiUpdate('Backup do Google Drive restaurado.');toast('Backup restaurado. Confira seus registros.','positive');
 }finally{v12DriveBusy=false;v12BackupMuted=false;}
}

 case 'v12-drive-disconnect':{v12Token='';v12TokenClient=null;v12RemoteVersion='';v12RemoteId='';clearTimeout(v12DriveTimer);v12DriveUiUpdate('Desconectado. Não foram apagados backups do Drive.');render();return;}
